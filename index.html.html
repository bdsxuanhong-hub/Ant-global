<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đàn kiến v6</title>
	<!-- PWA Manifest -->
	<link rel="manifest" href="manifest.json">

	<!-- Meta cho iOS và Android -->
	<meta name="theme-color" content="#222222">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-title" content="Đàn Kiến v7">
	<link rel="apple-touch-icon" href="icons/icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #111;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: #222;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            display: block;
        }
        #topRightInfo {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            color: #ddd;
            font-size: 12px;
            background: rgba(10,10,20,0.82);
            padding: 3px 12px;
            border-bottom: 1px solid #444;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        #weatherBar {
            position: absolute;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            background: rgba(10,10,30,0.88);
            border: 1px solid #334;
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 13px;
            color: #ddd;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        #weatherBar .wb-icon { font-size: 18px; line-height: 1; }
        #weatherBar .wb-name { font-weight: 700; font-size: 12px; }
        #weatherBar .wb-season { color: #aaa; font-size: 11px; }
        #envBar {
            position: absolute;
            top: 50%;
            left: 8px;
            transform: translateY(-50%);
            z-index: 11;
            background: rgba(10,10,20,0.82);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        #envBar .eb-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        #envBar .eb-icon { font-size: 14px; line-height: 1; }
        #envBar .eb-val  { color: #ccc; font-size: 10px; text-align: center; }
        /* warp visual handled in canvas */
        #nestList {
            position: absolute;
            top: 50px;
            right: 10px;
            z-index: 20;
            background: rgba(20,20,30,0.93);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 0;
            min-width: 170px;
            max-width: 190px;
            transition: min-width 0.15s, padding 0.15s;
        }
        #nestList.collapsed {
            min-width: 0;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #nestList .nl-title {
            color: #aaa;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px 6px;
            border-bottom: 1px solid #333;
            margin-bottom: 4px;
            cursor: pointer;
            user-select: none;
        }
        #nestList.collapsed .nl-title {
            padding: 0;
            border: none;
            margin: 0;
            justify-content: center;
            width: 32px;
            height: 32px;
        }
        #nestList.collapsed .nl-title-text { display: none; }
        #nestList .nl-toggle {
            color: #666;
            font-size: 13px;
            line-height: 1;
            font-weight: bold;
        }
        #nestList.collapsed .nl-toggle {
            font-size: 16px;
            color: #aaa;
        }
        #nestList .nl-body { overflow: hidden; }
        #nestList.collapsed .nl-body { display: none !important; }
        #nestList .nl-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin: 0 4px;
            transition: background 0.15s;
        }
        #nestList .nl-item:hover { background: rgba(255,255,255,0.08); }
        #nestList .nl-item.selected { background: rgba(255,255,255,0.15); }
        #nestList .nl-dot {
            width: 10px; height: 10px;
            border-radius: 50%; flex-shrink: 0;
        }
        #nestList .nl-row1 { display: flex; align-items: center; gap: 4px; }
        #nestList .nl-name { color: #ddd; font-size: 12px; font-weight: 700; }
        #nestList .nl-age  { color: #777; font-size: 10px; }
        #nestList .nl-food { font-size: 10px; margin-top: 1px; }
        #nestList .nl-food .nf { color: #4caf50; }
        #nestList .nl-food .nm { color: #f0f0f0; }
        #nestList .nl-food .nw { color: #8b5e3c; }
        #nestInfo {
            position: absolute;
            top: 50px;
            right: 210px;
            z-index: 20;
            background: rgba(12,13,22,0.97);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 12px 8px;
            color: #ccc;
            font-size: 11px;
            display: none;
            width: 210px;
            line-height: 1.5;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 24px rgba(0,0,0,0.55);
        }
        #nestInfo .ni-title  { font-weight:700; font-size:12px; color:#fff; display:flex; align-items:center; gap:6px; margin-bottom:6px; }
        #nestInfo .ni-dot    { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        #nestInfo .ni-state  { font-size:10px; font-weight:400; padding:1px 6px; border-radius:10px; margin-left:2px; }
        #nestInfo .ni-age    { margin-left:auto; color:#555; font-size:10px; font-weight:400; }
        #nestInfo .ni-sep    { border:none; border-top:1px solid rgba(255,255,255,0.07); margin:5px 0; }
        #nestInfo .ni-hpbar  { background:rgba(255,255,255,0.07); border-radius:3px; height:5px; margin:3px 0 5px; overflow:hidden; }
        #nestInfo .ni-hpbar-fill { height:100%; border-radius:3px; transition:width 0.3s; }
        #nestInfo .ni-grid   { display:grid; grid-template-columns:1fr 1fr; gap:2px 6px; }
        #nestInfo .ni-kv     { display:flex; align-items:baseline; gap:3px; }
        #nestInfo .ni-label  { color:#555; font-size:10px; white-space:nowrap; }
        #nestInfo .ni-val    { color:#ddd; font-size:11px; font-weight:600; }
        #nestInfo .ni-sec    { color:#666; font-size:10px; letter-spacing:0.04em; text-transform:uppercase; margin:5px 0 3px; }
        #nestInfo .ni-nursebar  { display:flex; gap:2px; height:6px; border-radius:3px; overflow:hidden; margin:3px 0 4px; }
        #nestInfo .ni-nursebar span { flex:1; transition:opacity 0.2s; }
        #nestInfo .ni-nurseleg  { display:grid; grid-template-columns:1fr 1fr; gap:1px 8px; margin-bottom:2px; }
        #nestInfo .ni-nurseleg .nl { display:flex; align-items:center; gap:3px; font-size:10px; color:#888; }
        #nestInfo .ni-nurseleg .nl b { width:7px; height:7px; border-radius:2px; flex-shrink:0; display:inline-block; }
        #nestInfo .ni-troops { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; }
        #nestInfo .ni-badge  { padding:1px 6px; border-radius:4px; font-size:10px; font-weight:600; }
        #resetView {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 20;
            padding: 5px 10px;
            background: rgba(40,40,40,0.85);
            color: #ccc;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        #resetView:hover {
            background: rgba(70,70,70,0.9);
            color: white;
        }
        #fpsCounter {
            position: absolute;
            bottom: 10px;
            left: 100px;
            z-index: 20;
            padding: 5px 10px;
            background: rgba(40,40,40,0.85);
            color: #0f0;
            border: 1px solid #555;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
        }
        #speedControls {
            position: absolute;
            bottom: 10px;
            left: 200px;
            z-index: 20;
            display: flex;
            gap: 4px;
        }
        #speedControls button {
            padding: 4px 8px;
            background: rgba(40,40,40,0.85);
            color: #ccc;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }
        #speedControls button.active {
            background: rgba(80,120,80,0.9);
            color: #fff;
            border-color: #8f8;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="world"></canvas>
        <div id="topRightInfo"></div>
        <div id="weatherBar"></div>
        <div id="envBar"></div>
        <div id="nestList"><div class="nl-title">🐜 Các tổ</div></div>
        <div id="nestInfo"></div>
        <button id="resetView">Reset View</button>
        <div id="fpsCounter">FPS: --</div>
        <div id="speedControls"><button id="sp1" class="active" onclick="setSpeed(1)">▶ x1</button><button id="sp2" onclick="setSpeed(2)">⏩ x2</button><button id="sp4" onclick="setSpeed(4)">⏩ x4</button></div>
    </div>

    <script>
        const container = document.getElementById("container");
        const canvas = document.getElementById("world");
        const ctx = canvas.getContext("2d");

        // Kích thước hiển thị (container) và thế giới thực
        let DISPLAY_WIDTH  = window.innerWidth;
        let DISPLAY_HEIGHT = window.innerHeight;
        const WORLD_WIDTH  = 3500;
        const WORLD_HEIGHT = 1700;
        const SKY_HEIGHT    = 98;  // dải bầu trời cố định trên canvas
        const GROUND_HEIGHT = 32;  // dải lòng đất cố định dưới canvas

        function resizeCanvas() {
            DISPLAY_WIDTH  = window.innerWidth;
            DISPLAY_HEIGHT = window.innerHeight;
            canvas.width   = DISPLAY_WIDTH;
            canvas.height  = DISPLAY_HEIGHT;
            // Tính lại zoom fit khi resize
            const _worldZoneH = DISPLAY_HEIGHT - SKY_HEIGHT - GROUND_HEIGHT;
            const sx = DISPLAY_WIDTH  / WORLD_WIDTH;
            const sy = _worldZoneH    / WORLD_HEIGHT;
            zoom = Math.min(sx, sy);
            offsetX = (DISPLAY_WIDTH  - WORLD_WIDTH  * zoom) / 2;
            offsetY = (_worldZoneH    - WORLD_HEIGHT * zoom) / 2;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        // Hỗ trợ xoay màn hình điện thoại
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

        const zoomMin = Math.min(DISPLAY_WIDTH / WORLD_WIDTH, (DISPLAY_HEIGHT - SKY_HEIGHT - GROUND_HEIGHT) / WORLD_HEIGHT) * 0.9;
        const zoomMax = 5.0;

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        let mouseX = 0, mouseY = 0;
        let mouseScreenX = 0, mouseScreenY = 0;

        let selectedNest = null; // Tổ đang được click chọn
        let gameSpeed = 1; // Tốc độ game: 1, 2, 4

        // FPS tracking
        let fps = 0;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        // ────────────────────────────────────────────────

        // ── Thế giới & Camera ──
        const MaxHP = 5000;
        const centerRadius = 45;
        const attackRadius = 10;
        const gridSize = 50;
        const nestNames = ['A','B','C','D','E','F','G','H','I','J'];

        // ── Giới hạn dân số ──
        const MAX_NURSE_EACH          = 20;   // mỗi loại nurse tối đa (5 × 50 = 250 tổng)
        const MAX_ANTS_PER_NEST       = 400;
        const LARVAE_HATCH_SLOW_RATIO = 3.0;
        const EGGS_LAY_SLOW_RATIO     = 5.0;
        const MAX_SCOUTS    = 50;
        const MAX_WAR_ANTS  = 80;
        const MAX_BOM_ANTS  = 10;
        const MAX_QUEEN_ANTS = 3;
        const MAX_NESTS_TOTAL = 5;
        const SCOUT_IN_MULTIPLIER_STARVING = 2.5;
        const WAR_IN_MULTIPLIER_WAR = 4;

        // ── Trứng & Tổ ──
        const MAX_EGGS_INITIAL     = { min: 20, max: 60 };
        const MAX_EGGS_QUEEN_SPAWN = { min: 15,  max: 60 };
        const MIN_DISTANCE_BETWEEN_NESTS = 250;

        // ── Nurse chuyên trách ──
        const NURSE_HOME_DEFENSE_BONUS = 0.5; // nurseHome → defenseRadius bonus
        const NURSE_MUSH_RATIO         = 0.5; // nurseMushroom → mushroom grow

        // ── Môi trường ──
        const MAX_TOTAL_WATER  = 200000;
        const MAX_WATER_POINTS = 40;
        const MAX_OBSTACLES    = 40;

        // ── Stone ──
        const STONE_HP_MIN       = 40;
        const STONE_HP_MAX       = 100;
        const STONE_ATTACK_RANGE = 30;
        const STONE_RESPAWN_TIME = 100000;
        // ── Pheromone dot system ──
        const pheromoneGrid = {};
        const pheromoneGridSize = 60;
        const MAX_PHEROMONES = 3000;

        function addPheromoneToGrid(p) {
            const key = `${Math.floor(p.x / pheromoneGridSize)},${Math.floor(p.y / pheromoneGridSize)}`;
            if (!pheromoneGrid[key]) pheromoneGrid[key] = [];
            pheromoneGrid[key].push(p);
        }

        function getNearbyPheromones(x, y, range = 80) {
            const gx = Math.floor(x / pheromoneGridSize);
            const gy = Math.floor(y / pheromoneGridSize);
            const cells = Math.ceil(range / pheromoneGridSize);
            const nearby = [];
            for (let dx = -cells; dx <= cells; dx++)
                for (let dy = -cells; dy <= cells; dy++) {
                    const key = `${gx+dx},${gy+dy}`;
                    if (pheromoneGrid[key]) nearby.push(...pheromoneGrid[key]);
                }
            return nearby;
        }

        // ── Helper: tổng nurse tất cả loại ──
        function totalNurse(n) { return n.nurseProduction + n.nurseRoyal + n.nurseLarvae + n.nurseMushroom + n.nurseHome; }

        // ── Phân bổ nurse mới nở từ larvae: ưu tiên từ trên xuống dưới ──
        // Phân bổ đều, ưu tiên từ trên xuống, lẻ dồn lên trên
        function distributeNewNurse(nest, count) {
            if (count <= 0) return;
            const types = ['nurseProduction', 'nurseRoyal', 'nurseLarvae', 'nurseMushroom', 'nurseHome'];
            const base  = Math.floor(count / 5);
            let   extra = count % 5; // số lẻ
            for (const t of types) {
                const space    = MAX_NURSE_EACH - nest[t];
                if (space <= 0) continue;
                const give     = Math.min(space, base + (extra > 0 ? 1 : 0));
                nest[t]       += give;
                if (extra > 0) extra--;
            }
            // cập nhật tổng legacy
            nest.nurse = totalNurse(nest);
        }
        const antGridSize = 80;
        let antGrid = {};
        let nestAntCache = new Map();
        let _antCacheDirty = true;   // rebuild nestAntCache khi có ant thêm/xóa
        let _antGridDirty  = true;   // rebuild antGrid mỗi frame (vị trí thay đổi)

        // ── CẢI TIẾN 1: Water spatial grid ──
        const waterGridSize = 150;
        let waterGrid = {};
        function addToWaterGrid(w) {
            if (!w.radiusX || w.radiusX <= 0) return;
            const r = Math.max(w.radiusX, w.radiusY);
            const x0 = Math.floor((w.x - r) / waterGridSize);
            const x1 = Math.floor((w.x + r) / waterGridSize);
            const y0 = Math.floor((w.y - r) / waterGridSize);
            const y1 = Math.floor((w.y + r) / waterGridSize);
            for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
                const key = `${gx},${gy}`;
                if (!waterGrid[key]) waterGrid[key] = [];
                waterGrid[key].push(w);
            }
        }
        function rebuildWaterGrid() {
            for (const k in waterGrid) waterGrid[k].length = 0;
            waters.forEach(w => addToWaterGrid(w));
        }
        function getNearbyWaters(x, y) {
            const gx = Math.floor(x / waterGridSize);
            const gy = Math.floor(y / waterGridSize);
            const out = [], seen = new Set();
            for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                const arr = waterGrid[`${gx+dx},${gy+dy}`];
                if (arr) for (const w of arr) { if (!seen.has(w)) { seen.add(w); out.push(w); } }
            }
            return out;
        }

        // ── CẢI TIẾN 2: Obstacle spatial grid ──
        const obstacleGridSize = 120;
        let obstacleGrid = {};
        function rebuildObstacleGrid() {
            for (const k in obstacleGrid) obstacleGrid[k].length = 0;
            obstacles.forEach(o => {
                const r = Math.max(o.w || o.rx || 40, o.h || o.ry || 40);
                const x0 = Math.floor((o.x - r) / obstacleGridSize);
                const x1 = Math.floor((o.x + r) / obstacleGridSize);
                const y0 = Math.floor((o.y - r) / obstacleGridSize);
                const y1 = Math.floor((o.y + r) / obstacleGridSize);
                for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
                    const key = `${gx},${gy}`;
                    if (!obstacleGrid[key]) obstacleGrid[key] = [];
                    obstacleGrid[key].push(o);
                }
            });
        }
        function getObstaclesNear(x, y) {
            const gx = Math.floor(x / obstacleGridSize);
            const gy = Math.floor(y / obstacleGridSize);
            const out = [], seen = new Set();
            for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                const arr = obstacleGrid[`${gx+dx},${gy+dy}`];
                if (arr) for (const o of arr) { if (!seen.has(o)) { seen.add(o); out.push(o); } }
            }
            return out;
        }

        function addPheromoneToGrid(p) {
            const key = `${Math.floor(p.x / pheromoneGridSize)},${Math.floor(p.y / pheromoneGridSize)}`;
            if (!pheromoneGrid[key]) pheromoneGrid[key] = [];
            pheromoneGrid[key].push(p);
        }

        function getNearbyPheromones(x, y, range = 80) {
            const gx = Math.floor(x/pheromoneGridSize), gy = Math.floor(y/pheromoneGridSize);
            const nearby = [];
            for (let dx = -1; dx <= 1; dx++)
                for (let dy = -1; dy <= 1; dy++) {
                    const a = pheromoneGrid[`${gx+dx},${gy+dy}`];
                    if (a) nearby.push(...a);
                }
            return nearby.filter(p => Math.hypot(p.x-x, p.y-y) <= range);
        }

        // ── CẢI TIẾN 4: Nest state helpers ──
        const NEST_STATE = { NORMAL:'NORMAL', STARVING:'STARVING', DEFENDING:'DEFENDING', ATTACKING:'ATTACKING', FLOODING:'FLOODING', DELETING:'DELETING' };

        let nests = [];
        let ants = [];
        let foods = [];
        let pheromones = [];
        let foodGrid = {};
        let waters = [];
        let explosions = [];
        let obstacles = [];
        let corpses = [];
        let warps = []; // {x, y, homeNest, creationTime, radius}
        let dusts = [];  // {x, y, creationTime}

        // Sinh bụi tại vị trí bất kỳ — dùng cho mọi trường hợp mất HP
        function spawnDust(x, y, now) {
            if (dusts.length >= 400) return; // giới hạn tối đa
            const count = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < count; i++) {
                dusts.push({ x: x + randFloat(-5, 5), y: y + randFloat(-5, 5), creationTime: now });
            }
        }

        let timers = {
            lastStarvationCheck: Date.now(),
            lastFoodSpawn: Date.now(),
            lastFoodGrowth: Date.now(),
            lastQueenHPEffect: Date.now(),
            lastQueenHeal: Date.now(),
            startTime: Date.now(),
            lastHomeAntConsumption: Date.now(),
            lastWaterGrowth: Date.now(),
            lastWaterSpawn: Date.now(),
            lastMushroomUpdate: Date.now(),
            lastMushroomProduce: Date.now(),
            lastStoneRespawn: Date.now(),
            lastDefenseUpdate: Date.now(),   // cập nhật defenseRadius mỗi 5s
            lastDefenseWoodCost: Date.now(), // tiêu wood mỗi 1s
            lastNestStateCheck: 0,           // throttle ants.some/filter scan mỗi 250ms
            lastNurseHomePatrol: 0,          // nurseHome patrol cycle 4s
        };

        let currentSeason = 0;
        const seasonDurations = [125000, 125000, 125000, 125000];
        const totalCycleDuration = seasonDurations.reduce((a,b)=>a+b,0);
        const seasonNames = ['Xuân', 'Hạ', 'Thu', 'Đông'];

        function getCurrentSeason(now = Date.now()) {
            const elapsed = now - timers.startTime;
            const pos = elapsed % totalCycleDuration;
            let cum = 0;
            for (let i = 0; i < 4; i++) {
                cum += seasonDurations[i];
                if (pos < cum) return i;
            }
            return 3;
        }

        // ══ HỆ THỐNG NGÀY / ĐÊM ══
        const DAY_NIGHT_CYCLE   = 60000;  // tổng 1 chu kỳ ngày+đêm (ms)
        // Tỉ lệ ban ngày theo mùa (phần còn lại là đêm)
        const DAY_RATIO_BY_SEASON = [0.5, 0.75, 0.5, 1/3]; // Xuân, Hạ, Thu, Đông
        let isNight = false;

        function getDayRatio() { return DAY_RATIO_BY_SEASON[currentSeason]; }

        function isFullMoonNight() {
            const nightIndex = Math.floor((Date.now() - timers.startTime) / DAY_NIGHT_CYCLE);
            return isNight && (nightIndex % 8) === 4;
        }

        function updateDayNight(now) {
            const phase = (now - timers.startTime) % DAY_NIGHT_CYCLE;
            const dayDuration = DAY_NIGHT_CYCLE * getDayRatio();
            const wasNight = isNight;
            isNight = phase >= dayDuration;
            // Vừa chuyển sang đêm mà đang nắng → đổi thời tiết ngay
            if (isNight && !wasNight && currentWeather === 'sunny') {
                currentWeather = rollWeather(currentSeason);
                weatherTimer = now + weatherDuration;
            }
        }

        // 0→1: tiến trình trong ban ngày hiện tại (0=mới mọc, 1=sắp lặn)
        function getDayProgress(now) {
            const phase = (now - timers.startTime) % DAY_NIGHT_CYCLE;
            return Math.min(1, phase / (DAY_NIGHT_CYCLE * getDayRatio()));
        }

        // 0→1: tiến trình trong ban đêm hiện tại
        function getNightProgress(now) {
            const phase = (now - timers.startTime) % DAY_NIGHT_CYCLE;
            const dayDur = DAY_NIGHT_CYCLE * getDayRatio();
            if (phase < dayDur) return 0;
            return (phase - dayDur) / (DAY_NIGHT_CYCLE - dayDur);
        }

        // ══ HỆ THỐNG THỜI TIẾT ══
        let currentWeather = 'sunny';
        let weatherTimer = 0;
        let weatherDuration = 0;
        let weatherIntensity = 1.0; // 0..1

        // Thời tiết theo mùa — không còn 'cloudy', 'sunny' chỉ ban ngày
        const WEATHERS_BY_SEASON = {
            0: [ // Xuân
                { name: 'sunny',   prob: 0.35 },
                { name: 'rain',    prob: 0.65 },
            ],
            1: [ // Hạ
                { name: 'sunny',   prob: 0.70 },
                { name: 'wind',    prob: 0.30 },
            ],
            2: [ // Thu
                { name: 'wind',    prob: 0.55 },
                { name: 'rain',    prob: 0.45 },
            ],
            3: [ // Đông
                { name: 'wind',    prob: 0.55 },
                { name: 'rain',    prob: 0.45 },
            ],
        };

        const WEATHER_DISPLAY = {
            sunny:  { label: 'Nắng',       bigIcon: '☀️' },
            rain:   { label: 'Mưa',        bigIcon: '🌧️' },
            wind:   { label: 'Gió mạnh',   bigIcon: '🌬️' },
        };

        function rollWeather(season) {
            // Nếu đang là đêm, không roll 'sunny' — chỉ các loại thời tiết khác
            const list = WEATHERS_BY_SEASON[season].filter(w => !(isNight && w.name === 'sunny'));
            if (list.length === 0) return 'wind';
            // Chuẩn hoá lại xác suất
            const total = list.reduce((s, w) => s + w.prob, 0);
            let r = Math.random() * total;
            for (const w of list) { r -= w.prob; if (r <= 0) return w.name; }
            return list[0].name;
        }

        function getWeatherInfo(name, season) {
            const all = WEATHERS_BY_SEASON[season] || WEATHERS_BY_SEASON[0];
            return all.find(w => w.name === name) || all[0];
        }

        function updateWeather(now) {
            if (now < weatherTimer) return;
            currentWeather = rollWeather(currentSeason);
            weatherIntensity = 0.5 + Math.random() * 0.5;
            weatherDuration  = 5000 + Math.random() * 10000; // random 5–15s
            weatherTimer     = now + weatherDuration;
        }

        // Hệ số tốc độ scout — kết hợp thời tiết + ngày/đêm
        // ══ Chỉ số thời tiết → hệ số ảnh hưởng ══
        // Tất cả ảnh hưởng lên ant/nest tính qua wi (light, humidity, wind, temp)

        // ── Chỉ số thời tiết: deterministic, không dùng Math.random ──
        function getWeatherIndices() {
            const p = getDayProgress(Date.now());
            const s = currentSeason;
            const baseTempBySeason = [22, 35, 18, 5];
            let temp = baseTempBySeason[s];
            let light;
            if (!isNight) {
                if      (p < 0.10) { light = 10 + p/0.10*30; temp -= 5; }
                else if (p < 0.35) { light = 40 + (p-0.10)/0.25*35; temp -= 2; }
                else if (p < 0.65) { light = 75 + (p-0.35)/0.30*25; }
                else if (p < 0.90) { light = 100 - (p-0.65)/0.25*35; temp -= 2; }
                else               { light = 65 - (p-0.90)/0.10*55; temp -= 5; }
            } else {
                light = 5; temp -= 8;
            }
            let humidity, wind;
            switch(currentWeather) {
                case 'rain':   humidity = 88; wind = 25; light *= 0.45; temp -= 4; break;
                case 'wind':   humidity = 45; wind = 70; light *= 0.75; temp -= 2; break;
                // Hạ sunny: humidity cao hơn để bù nhiệt (45 thay vì 28)
                case 'sunny':  humidity = s === 1 ? 45 : 28; wind = 10; temp += s === 1 ? 5 : 2; break;
                default:       humidity = 55; wind = 20; break;
            }
            const humidityBySeason = [60, 45, 55, 35];
            humidity = Math.max(10, Math.min(100, humidity * (humidityBySeason[s] / 50)));
            return { light: Math.round(Math.max(0, Math.min(100, light))), humidity: Math.round(humidity), wind: Math.round(Math.max(0, Math.min(100, wind))), temp: Math.round(Math.max(-10, Math.min(45, temp))) };
        }

        // Cache env multipliers — tính lại tối đa 1 lần/frame
        let _envCache = null, _envCacheTime = -1;
        function getEnvMultipliers() {
            const t = Math.floor(Date.now() / 16);
            if (t === _envCacheTime && _envCache) return _envCache;
            _envCacheTime = t;
            const wi = getWeatherIndices();
            const tf = 1 - Math.abs(wi.temp - 24) / 60;

            // Speed đêm: 0.7 (Đông lạnh) → 0.9 (Hạ ấm), ngày bình thường
            // temp đêm: Đông ≈ -1°C → factor 0.70 | Hạ ≈ 32°C → factor 0.90
            const nightSpeedFactor = isNight ? (0.72 + Math.max(0, Math.min(0.20, (wi.temp + 2) / 170))) : 1.0;
            const fullMoonBonus = isFullMoonNight() ? 1.15 : 1.0; // trăng tròn: +15% speed
            const speedMult = Math.max(0.65, Math.min(1.40,
                ((wi.light/100)*0.55 + (1-wi.wind/100)*0.1 + tf*0.2 + 0.35) * nightSpeedFactor * fullMoonBonus
            ));

            const decayMult = Math.max(0.5, Math.min(2.5, 1 + (wi.wind/100)*1.2 - (wi.humidity/100)*0.6));

            // foodMult: penalty mạnh khi lạnh + mưa (mưa lạnh < 5°C → phạt 70%)
            let foodMult = Math.max(0.05, Math.min(2.5, (wi.light/100)*0.6 + (wi.humidity/100)*0.6 + tf*0.3 - 0.2));
            if (wi.temp < 5 && currentWeather === 'rain') foodMult *= 0.3;  // mưa lạnh
            if (wi.temp < 0) foodMult = Math.min(foodMult, 0.1);            // đóng băng

            // Water seasonal: Xuân nhỏ nhiều, Hạ to ít, Thu vừa, Đông cạn
            const seasonWaterMod = [0.6, 1.8, 0.8, -0.4][currentSeason];
            let waterMult = Math.max(-0.8, Math.min(3.0, (wi.humidity/100)*2.5 - (wi.temp/45)*0.8 - (wi.wind/100)*0.4 + seasonWaterMod));
            if (wi.temp < 5) waterMult = Math.min(waterMult, -0.3);

            _envCache = { speedMult, decayMult, foodMult, waterMult, wi };
            return _envCache;
        }

        function getSeasonProperties(season) {
            const { foodMult } = getEnvMultipliers();
            // Seasonal food: maxAmount và growth theo từng mùa
            const seasonFoodMax  = [4000,  12000, 3000,  500  ]; // Xuân nhỏ nhiều, Hạ to ít, Thu vừa, Đông tối thiểu
            const seasonFoodGrow = [1.8,   1.0,   0.4,   0.05 ]; // tốc độ tăng trưởng cơ bản
            return {
                growthMultiplier: foodMult * seasonFoodGrow[season],
                maxAmount: seasonFoodMax[season],
                sizeMultiplier: season === 1 ? 2.0 : (season === 0 ? 0.8 : (season === 3 ? 0.4 : 1.0)),
                color: season === 0 ? '#ADFF2F' : season === 1 ? '#228B22' : season === 2 ? '#FFAA00' : '#B8860B',
                spawnAllowed: true,
                spawnCountMultiplier: Math.max(0.3, Math.min(3, foodMult * seasonFoodGrow[season]))
            };
        }

        function getFoodPickupRadius(amount, season) {
            const props = getSeasonProperties(season);
            return (8 + (amount / 6000) * 16) * props.sizeMultiplier;
        }

        // ✅ PA1: Trả về điểm gần nhất trên viền ellipse từ vị trí (fromX, fromY)
        // Scout sẽ moveTowards điểm này thay vì tâm water → không bao giờ đi xuyên vào giữa
        function getWaterEdgePoint(water, fromX, fromY) {
            if (!water.radiusX || water.radiusX <= 0) return { x: water.x, y: water.y };
            // Chuyển từ về hệ trục cục bộ của ellipse (xoay theo shapeAngle)
            const cosA =  Math.cos(-water.shapeAngle);
            const sinA =  Math.sin(-water.shapeAngle);
            const dx = fromX - water.x;
            const dy = fromY - water.y;
            const lx = dx * cosA - dy * sinA;  // tọa độ local x
            const ly = dx * sinA + dy * cosA;  // tọa độ local y
            // Chuẩn hóa về đường tròn đơn vị (scale theo radiusX, radiusY)
            const nx = lx / water.radiusX;
            const ny = ly / water.radiusY;
            const len = Math.hypot(nx, ny) || 1;
            // Điểm trên viền ellipse (hệ cục bộ)
            const ex = (nx / len) * water.radiusX;
            const ey = (ny / len) * water.radiusY;
            // Chuyển ngược về hệ world (xoay ngược)
            const cosB = Math.cos(water.shapeAngle);
            const sinB = Math.sin(water.shapeAngle);
            return {
                x: water.x + ex * cosB - ey * sinB,
                y: water.y + ex * sinB + ey * cosB
            };
        }

        function adjustFoodOnSeasonChange(newSeason) {
            if (newSeason === 0) {
                const target = Math.min(foods.length * 2, 150);
                while (foods.length < target) {
                    const amount = randInt(600, 4000);
                    const food = {
                        x: randInt(50, WORLD_WIDTH - 50),
                        y: randInt(50, WORLD_HEIGHT - 50),
                        amount: amount / 2,
                        wood: amount / 2,
                        isSpecial: false
                    };
                    foods.push(food);
                    addToGrid(food, food.x, food.y);
                }
            }
        }

        function getTotalWaterAmount() {
            return waters.reduce((sum, w) => sum + w.amount, 0);
        }

        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function randFloat(min, max) { return Math.random() * (max - min) + min; }

        function spawnInitialWaters() {
            waters = [];
            for (let i = 0; i < MAX_WATER_POINTS; i++) {
                const maxAmt = 6000 + randInt(0, 4000);
                const water = {
                    x: randInt(160, WORLD_WIDTH - 160),
                    y: randInt(160, WORLD_HEIGHT - 160),
                    amount: randInt(2000, 6000),
                    maxAmount: maxAmt,
                    shapeAngle: randFloat(0, Math.PI * 2),
                    shapeRatio: randFloat(0.6, 1.8),
                    radiusX: 0,
                    radiusY: 0,
                    isPuddle: false,
                    permanent: true // điểm nước cố định không bị xóa
                };
                updateWaterRegion(water);
                waters.push(water);
            }
        }

        // WarAnt tấn công mọi stone trong tầm
        function attackNearbyStones(ant, stones, now) {
            if (now - ant.lastAttackTime < 400) return;
            stones.forEach(stone => {
                const dist = Math.hypot(stone.x - ant.x, stone.y - ant.y);
                if (dist < STONE_ATTACK_RANGE) {
                    stone.hp -= 1;
                    if (stone.hp >= 0) spawnDust(stone.x, stone.y, now);
                    ant.lastAttackTime = now;
                    // Knockback WarAnt ra xa stone (y như tấn công kẻ địch)
                    const dx = ant.x - stone.x;
                    const dy = ant.y - stone.y;
                    const d  = Math.hypot(dx, dy) || 1;
                    const knockbackSpeed = 14 / 0.2;
                    ant.knockbackVelocity = { x: (dx / d) * knockbackSpeed, y: (dy / d) * knockbackSpeed };
                    ant.knockbackEndTime  = now + 200;
                }
            });
        }

        // Spawn 1 stone mới ngẫu nhiên
        function spawnStone() {
            const shapes = ['ellipse', 'polygon', 'rect'];
            const shape = shapes[randInt(0, shapes.length - 1)];
            const hp = randInt(STONE_HP_MIN, STONE_HP_MAX);
            const cracks = _genCracks(shape);
            if (shape === 'rect') {
                obstacles.push({
                    type: 'stone', shape, x: randInt(150, WORLD_WIDTH - 150),
                    y: randInt(150, WORLD_HEIGHT - 150),
                    w: randInt(160, 320), h: randInt(24, 44),
                    angle: randFloat(0, Math.PI), color: '#888', borderColor: '#aaa',
                    hp, maxHp: hp, cracks
                });
            } else if (shape === 'polygon') {
                const r = randInt(50, 110), sides = randInt(5, 8);
                const cx = randInt(150, WORLD_WIDTH - 150), cy = randInt(150, WORLD_HEIGHT - 150);
                const pts = [];
                for (let s = 0; s < sides; s++) {
                    const a = (s / sides) * Math.PI * 2 + randFloat(-0.3, 0.3);
                    pts.push({ x: cx + Math.cos(a) * r * randFloat(0.7, 1.2), y: cy + Math.sin(a) * r * randFloat(0.7, 1.2) });
                }
                obstacles.push({
                    type: 'stone', shape, x: cx, y: cy, r, points: pts, angle: 0,
                    color: '#666', borderColor: '#999', hp, maxHp: hp, cracks
                });
            } else {
                obstacles.push({
                    type: 'stone', shape, x: randInt(150, WORLD_WIDTH - 150),
                    y: randInt(150, WORLD_HEIGHT - 150),
                    rx: randInt(40, 90), ry: randInt(30, 70),
                    angle: randFloat(0, Math.PI), color: '#777', borderColor: '#aaa',
                    hp, maxHp: hp, cracks
                });
            }
        }

        // Respawn stone để duy trì số lượng max, mỗi 200s
        function updateStoneRespawn(now) {
            if (now - timers.lastStoneRespawn < STONE_RESPAWN_TIME) return;
            timers.lastStoneRespawn = now;
            if (obstacles.length < MAX_OBSTACLES) { spawnStone(); rebuildObstacleGrid(); }
        }
        function spawnObstacles() {
            obstacles = [];
            const shapes = ['ellipse', 'polygon', 'rect'];
            for (let i = 0; i < MAX_OBSTACLES; i++) {
                const shape = shapes[randInt(0, shapes.length - 1)];
                const hp = randInt(STONE_HP_MIN, STONE_HP_MAX);
                // Tạo các vết nứt cố định (seed) cho mỗi stone
                const cracks = _genCracks(shape);
                if (shape === 'rect') {
                    const angle = randFloat(0, Math.PI);
                    const w = randInt(160, 320), h = randInt(24, 44);
                    obstacles.push({
                        type: 'stone', shape, x: randInt(150, WORLD_WIDTH - 150),
                        y: randInt(150, WORLD_HEIGHT - 150),
                        w, h, angle, color: '#888', borderColor: '#aaa',
                        hp, maxHp: hp, cracks
                    });
                } else if (shape === 'polygon') {
                    const r = randInt(50, 110);
                    const sides = randInt(5, 8);
                    const cx = randInt(150, WORLD_WIDTH - 150);
                    const cy = randInt(150, WORLD_HEIGHT - 150);
                    const pts = [];
                    for (let s = 0; s < sides; s++) {
                        const a = (s / sides) * Math.PI * 2 + randFloat(-0.3, 0.3);
                        pts.push({ x: cx + Math.cos(a) * r * randFloat(0.7, 1.2), y: cy + Math.sin(a) * r * randFloat(0.7, 1.2) });
                    }
                    obstacles.push({
                        type: 'stone', shape, x: cx, y: cy, r,
                        points: pts, angle: 0, color: '#666', borderColor: '#999',
                        hp, maxHp: hp, cracks
                    });
                } else {
                    const rx = randInt(40, 90), ry = randInt(30, 70);
                    obstacles.push({
                        type: 'stone', shape, x: randInt(150, WORLD_WIDTH - 150),
                        y: randInt(150, WORLD_HEIGHT - 150),
                        rx, ry, angle: randFloat(0, Math.PI), color: '#777', borderColor: '#aaa',
                        hp, maxHp: hp, cracks
                    });
                }
            }
        }

        // Tạo set vết nứt ngẫu nhiên cố định cho 1 stone (tọa độ local)
        function _genCracks(shape) {
            const lines = [];
            const count = randInt(4, 8);
            for (let i = 0; i < count; i++) {
                // Điểm bắt đầu gần tâm, kéo ra ngoài
                const angle = randFloat(0, Math.PI * 2);
                const len   = randFloat(10, 40);
                const ox    = randFloat(-15, 15);
                const oy    = randFloat(-15, 15);
                // Thêm 1-2 nhánh nhỏ
                const branches = [];
                if (Math.random() < 0.5) {
                    const ba = angle + randFloat(0.3, 0.9) * (Math.random() < 0.5 ? 1 : -1);
                    branches.push({ angle: ba, len: len * randFloat(0.3, 0.6) });
                }
                lines.push({ ox, oy, angle, len, branches });
            }
            return lines;
        }

        // Kiểm tra xem điểm (px,py) có nằm trong chướng ngại vật không
        function isPointInObstacle(px, py) {
            for (const obs of getObstaclesNear(px, py)) {
                if (obs.shape === 'rect') {
                    const cos = Math.cos(-obs.angle), sin = Math.sin(-obs.angle);
                    const dx = px - obs.x, dy = py - obs.y;
                    const lx = dx * cos - dy * sin;
                    const ly = dx * sin + dy * cos;
                    if (Math.abs(lx) < obs.w / 2 && Math.abs(ly) < obs.h / 2) return obs;
                } else if (obs.shape === 'ellipse') {
                    const cos = Math.cos(-obs.angle), sin = Math.sin(-obs.angle);
                    const dx = px - obs.x, dy = py - obs.y;
                    const lx = dx * cos - dy * sin;
                    const ly = dx * sin + dy * cos;
                    if ((lx / obs.rx) ** 2 + (ly / obs.ry) ** 2 <= 1.1) return obs;
                } else if (obs.shape === 'polygon' && obs.points) {
                    // Point-in-polygon (ray casting)
                    const pts = obs.points;
                    let inside = false;
                    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                        const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
                        const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
                        if (intersect) inside = !inside;
                    }
                    if (inside) return obs;
                }
            }
            return null;
        }

        // Trả về danh sách các cặp warp đang kết nối thành tường (Warp Wall)
        

        // Tính pháp tuyến đẩy ra khỏi chướng ngại vật (wall-following)
        function getObstacleEscapeAngle(px, py, obs) {
            // Hướng từ tâm obstacle ra ngoài
            const dx = px - obs.x, dy = py - obs.y;
            const base = Math.atan2(dy, dx);
            // Thêm offset 90° để đi dọc theo viền
            return base + Math.PI / 2 + randFloat(-0.3, 0.3);
        }

        function updateWaterRegion(w) {
            if (w.amount <= 0) {
                w.radiusX = 0;
                w.radiusY = 0;
                return;
            }
            const baseRadius = 10;
            const scaleFactor = 0.018;
            let r = baseRadius + w.amount * scaleFactor;
            r = Math.min(r, 350);
            w.radiusX = r * w.shapeRatio;
            w.radiusY = r / w.shapeRatio;
            if (w.amount < 400) {
                const lowRatio = w.amount / 400;
                w.radiusX *= 0.5 + 0.5 * lowRatio;
                w.radiusY *= 0.5 + 0.5 * lowRatio;
                w.radiusX = Math.max(8, w.radiusX);
                w.radiusY = Math.max(8, w.radiusY);
            }
        }

        function isPointInWater(px, py, water) {
            if (water.radiusX <= 0 || water.radiusY <= 0) return false;
            const dx = px - water.x;
            const dy = py - water.y;
            const cosA = Math.cos(-water.shapeAngle);
            const sinA = Math.sin(-water.shapeAngle);
            const rx = dx * cosA - dy * sinA;
            const ry = dx * sinA + dy * cosA;
            const normX = rx / water.radiusX;
            const normY = ry / water.radiusY;
            return (normX * normX + normY * normY) <= 1.05;
        }

        function updateWatersGrowth(now) {
            if (now - timers.lastWaterGrowth < 3000) return;
            timers.lastWaterGrowth = now;
            const { waterMult } = getEnvMultipliers();
            // Max water amount theo mùa: Xuân nhỏ, Hạ to, Thu vừa, Đông nhỏ
            const seasonWaterMax = [3000, 18000, 5000, 1000][currentSeason];
            waters.forEach(w => {
                if (w.amount <= 0) return;
                const oldAmount = w.amount;
                if (w.isPuddle) {
                    w.amount -= 120;
                } else {
                    // Cap theo mùa
                    const cap = Math.min(w.maxAmount, seasonWaterMax);
                    w.amount = Math.min(w.amount + (w.permanent ? 150 : 60) * waterMult, cap);
                }
                w.amount = Math.max(0, w.amount);
                if (w.amount !== oldAmount) updateWaterRegion(w);
            });
            const _totalWater = waters.reduce((s, w) => s + (w.amount || 0), 0);
            if (_totalWater > MAX_TOTAL_WATER) {
                const _capRatio = MAX_TOTAL_WATER / _totalWater;
                waters.forEach(w => { w.amount = Math.floor(w.amount * _capRatio); updateWaterRegion(w); });
            }
            // Xóa tất cả điểm nước đã cạn (kể cả permanent), giữ puddle cho đến khi < 80
            waters = waters.filter(w => {
                if (w.isPuddle) return w.amount > 80;
                return w.amount > 0;
            });

            // Spawn điểm mới để bù vào chỗ bị xóa — chỉ khi môi trường đủ ẩm
            const permanentCount = waters.filter(w => w.permanent && !w.isPuddle).length;
            if (permanentCount < MAX_WATER_POINTS) {
                const toAdd = MAX_WATER_POINTS - permanentCount;
                for (let i = 0; i < toAdd; i++) {
                    const maxAmt = 6000 + randInt(0, 4000);
                    // Khởi amount theo waterMult: khô hạn thì sinh ra nhỏ hơn
                    const initAmt = Math.max(200, Math.floor(randInt(1000, 3000) * Math.max(0.2, waterMult)));
                    const w = { x: randInt(160, WORLD_WIDTH-160), y: randInt(160, WORLD_HEIGHT-160),
                        amount: initAmt, maxAmount: maxAmt,
                        shapeAngle: randFloat(0, Math.PI*2), shapeRatio: randFloat(0.6, 1.8),
                        radiusX: 0, radiusY: 0, isPuddle: false, permanent: true };
                    updateWaterRegion(w);
                    waters.push(w);
                }
            }
            rebuildWaterGrid();
        }

        const usedHues = new Set();

        function isInView(x, y) {
            const margin = 200 / zoom;
            const left   = -offsetX / zoom - margin;
            const right  = (-offsetX + DISPLAY_WIDTH) / zoom + margin;
            const top    = -offsetY / zoom - margin;
            const bottom = (-offsetY + DISPLAY_HEIGHT) / zoom + margin;
            return x >= left && x <= right && y >= top && y <= bottom;
        }

        function addToGrid(obj, x, y) {
            const key = `${Math.floor(x / gridSize)},${Math.floor(y / gridSize)}`;
            foodGrid[key] = foodGrid[key] || [];
            foodGrid[key].push(obj);
        }

        function getNearbyObjects(x, y) {
            const nearby = [];
            const gx = Math.floor(x / gridSize);
            const gy = Math.floor(y / gridSize);
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const key = `${gx + dx},${gy + dy}`;
                    if (foodGrid[key]) nearby.push(...foodGrid[key]);
                }
            }
            return nearby;
        }

        function moveTowards(x, y, speed) {
            const dx = x - this.x;
            const dy = y - this.y;
            const dist = Math.hypot(dx, dy) || 1;
            let newX = this.x + (dx / dist) * speed;
            let newY = this.y + (dy / dist) * speed;

            // ── Tránh nước ──
            let shouldAvoidWater = true;
            if (this.targetWater) shouldAvoidWater = false;
            if (this.carryingWater > 0 || this.carryingWood > 0) shouldAvoidWater = true;
            if (shouldAvoidWater) {
                for (const w of getNearbyWaters(newX, newY)) {
                    if (w.amount > 150 && isPointInWater(newX, newY, w)) {
                        const baseAngle = Math.atan2(dy, dx);
                            if (this._avoidingWater !== w) {
                            this._avoidingWater = w;
                            this._waterSide = Math.random() < 0.5 ? 1 : -1;
                            this._waterAvoidCount = 0;
                        }
                        this._waterAvoidCount = (this._waterAvoidCount || 0) + 1;
                        if (this._waterAvoidCount > 120) {
                            this._waterSide *= -1;
                            this._waterAvoidCount = 0;
                        }
                        const side = this._waterSide;
                        const avoidAngle = baseAngle + side * (Math.PI / 2) + randFloat(-0.2, 0.2);
                        newX = this.x + Math.cos(avoidAngle) * speed * 0.8;
                        newY = this.y + Math.sin(avoidAngle) * speed * 0.8;
                        break;
                    }
                }
            } else {
                this._waterSide = null;
                this._avoidingWater = null;
                this._waterAvoidCount = 0;
            }

            // ── Tránh chướng ngại vật (wall-following) ──
            const hitObs = isPointInObstacle(newX, newY);
            if (hitObs) {
                // Lần đầu gặp: chọn hướng đi theo viền (CW hoặc CCW)
                if (!this._wallFollowing) {
                    this._wallSide = Math.random() < 0.5 ? 1 : -1;
                    this._wallFollowing = true;
                    this._wallFollowStart = Date.now();
                }
                const escapeBase = getObstacleEscapeAngle(this.x, this.y, hitObs);
                const wallAngle = escapeBase + this._wallSide * (Math.PI / 2);
                newX = this.x + Math.cos(wallAngle) * speed;
                newY = this.y + Math.sin(wallAngle) * speed;
                // Nếu vẫn trong obstacle, thử hướng ngược lại
                if (isPointInObstacle(newX, newY)) {
                    newX = this.x + Math.cos(escapeBase) * speed;
                    newY = this.y + Math.sin(escapeBase) * speed;
                }
            } else {
                // Thoát khỏi obstacle sau tối đa 2s
                if (this._wallFollowing && Date.now() - this._wallFollowStart > 2000) {
                    this._wallFollowing = false;
                    this._wallSide = null;
                }
            }

            this.x = Math.max(10, Math.min(WORLD_WIDTH - 10, newX));
            this.y = Math.max(10, Math.min(WORLD_HEIGHT - 10, newY));
            return dist;
        }

        function moveInCircleWithReflection(nest, speed, innerRadius, outerRadius) {
            this.direction = this.direction || Math.random() * Math.PI * 2;
            const now = Date.now();
            if (!this.randomDirectionTime || now - this.randomDirectionTime > 500 ||
                this.x <= 10 || this.x >= WORLD_WIDTH - 10 ||
                this.y <= 10 || this.y >= WORLD_HEIGHT - 10) {
                this.direction = Math.random() * Math.PI * 2;
                this.randomDirectionTime = now;
            }
            let newX = this.x + Math.cos(this.direction) * speed;
            let newY = this.y + Math.sin(this.direction) * speed;
            const distToNest = Math.hypot(newX - nest.x, newY - nest.y);
            if (distToNest > outerRadius || distToNest < innerRadius) {
                const angleToNest = Math.atan2(this.y - nest.y, this.x - nest.x);
                const angleOfIncidence = this.direction - angleToNest;
                this.direction = angleToNest - angleOfIncidence + Math.PI;
                newX = this.x + Math.cos(this.direction) * speed;
                newY = this.y + Math.sin(this.direction) * speed;
            }
            this.x = newX;
            this.y = newY;
        }

        function moveToBoundaryCircle(nest, speed, innerRadius, outerRadius) {
            const distToNest = Math.hypot(this.x - nest.x, this.y - nest.y);
            if (distToNest < innerRadius || distToNest > outerRadius) {
                const targetX = nest.x + Math.cos(this.direction) * (innerRadius + (outerRadius - innerRadius) / 2);
                const targetY = nest.y + Math.sin(this.direction) * (innerRadius + (outerRadius - innerRadius) / 2);
                moveTowards.call(this, targetX, targetY, speed);
            } else {
                moveInCircleWithReflection.call(this, nest, speed, innerRadius, outerRadius);
            }
        }

        function getUniqueColor() {
            const distinctHues = [60,120,180,240,300,90,150,270,30,210].filter(h=>!usedHues.has(h));
            if (distinctHues.length===0) {
                let hue, attempts=0;
                do { hue=randInt(0,360); attempts++; } while ((Math.abs(hue-0)<30 || usedHues.has(hue)) && attempts<100);
                usedHues.add(hue);
                return `hsl(${hue},100%,50%)`;
            }
            const hue = distinctHues[randInt(0,distinctHues.length-1)];
            usedHues.add(hue);
            return `hsl(${hue},100%,50%)`;
        }

        // Hệ số bonus theo tuổi tổ (0.0 → 1.0 sau 10 phút)
        function getNestAgeMult(nest) {
            if (!nest || !nest.creationTime) return 0;
            const ageSeconds = (Date.now() - nest.creationTime) / 1000;
            return Math.min(ageSeconds / 600, 1.0); // đạt max sau 10 phút
        }

        function setSpeed(s) {
            gameSpeed = s;
            [1,2,4].forEach(v => {
                const b = document.getElementById('sp'+v);
                if (b) b.className = (v === s) ? 'active' : '';
            });
        }

        function updateTopRightInfo() {
            const now = Date.now();
            const newSeason = getCurrentSeason(now);
            if (newSeason !== currentSeason) {
                currentSeason = newSeason;
                adjustFoodOnSeasonChange(currentSeason);
                if (currentSeason === 0 && foods.length < 10) {

            }

                `<span class="eb-item"><span class="eb-icon">💨</span><span class="eb-val">${wi.wind}</span></span>` +
                `<span class="eb-item"><span class="eb-icon">🌡</span><span class="eb-val">${wi.temp}°C</span></span>`;
            // Weather bar — chỉ hiện thời tiết (không còn night)

            const _timeLeft = Math.max(0, Math.ceil((weatherTimer - now) / 1000));
            const wb = document.getElementById("weatherBar");
            if (wb) wb.innerHTML = `<span class="wb-icon">${_wd.bigIcon}</span><span class="wb-name">${_wd.label}</span><span class="wb-season">${_timeLeft}s</span>`;

        function spawnFoods() {
            foods = [];
            foodGrid = {};
            const baseCount = 20;
            const multiplier = getSeasonProperties(currentSeason).spawnCountMultiplier;
            const wi = getWeatherIndices();
            const envMult = (wi.light / 100 * 0.6) + (wi.humidity / 100 * 0.4);
            const total = Math.floor(baseCount * multiplier);
            const MIN_DIST = 550; // khoảng cách tối thiểu giữa các food node
            const MAX_ATTEMPTS = 25; // thử tối đa 25 lần tìm vị trí trống
            for (let i = 0; i < total; i++) {
                let x, y, ok = false;
                for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                    x = randInt(150, WORLD_WIDTH  - 150);
                    y = randInt(150, WORLD_HEIGHT - 150);
                    // Kiểm tra không quá gần food đã có
                    const tooClose = foods.some(f => Math.hypot(f.x - x, f.y - y) < MIN_DIST);
                    if (!tooClose) { ok = true; break; }
                }
                const baseAmt = randInt(600, 1600);
                const amount  = Math.floor(baseAmt * Math.max(0.3, envMult));
                const food = { x, y, amount: amount / 2, wood: amount / 2, isSpecial: false };
                foods.push(food);
                addToGrid(food, food.x, food.y);
            }
        }

        function attackEnemy(attacker, enemies, now) {
            if (!enemies.length) return;
            const nearestEnemy = enemies.reduce((closest, e) => {
                const dist = Math.hypot(e.x - attacker.x, e.y - attacker.y);
                if (!closest) return e;
                const closestDist = Math.hypot(closest.x - attacker.x, closest.y - attacker.y);
                return dist < closestDist ? e : closest;
            }, null);
            const dist = Math.hypot(nearestEnemy.x - attacker.x, nearestEnemy.y - attacker.y);
            if (dist < attackRadius && now - attacker.lastAttackTime >= 400) {
                nearestEnemy.hp -= 1;
                if (nearestEnemy.hp <= 0) nearestEnemy.toRemove = true;
                if (attacker.type === "WarAnt" || attacker.type === "BomAnt") {
                    attacker.hp -= 1;
                    if (attacker.hp <= 0) attacker.toRemove = true;
                }
                attacker.lastAttackTime = now;
                if ((attacker.type === "WarAnt" || attacker.type === "BomAnt") && attacker.hp > 0) {
                    const dx = nearestEnemy.x - attacker.x;
                    const dy = nearestEnemy.y - attacker.y;
                    const distToEnemy = Math.hypot(dx, dy) || 1;
                    const knockbackForce = 14;
                    const knockbackSpeed = knockbackForce / 0.2;
                    attacker.knockbackVelocity = { x: -(dx / distToEnemy) * knockbackSpeed, y: -(dy / distToEnemy) * knockbackSpeed };
                    attacker.knockbackEndTime = now + 200;
                }
            }
        }

        function attackTargetNest(ant, targetNest, speed, now) {
            if (!targetNest) return;
            const dist = moveTowards.call(ant, targetNest.x, targetNest.y, speed);
            if (dist < 10 && now - ant.lastAttackTime >= 400) {
                const _nestAM = ant.homeNest ? getNestAgeMult(ant.homeNest) : 0;
                // ✅ BUG3 FIX: damageMultiplier xét thêm larvae (>50 coi là có phòng thủ)
                const hasDefenders = totalNurse(targetNest) > 0 || targetNest.scoutIn > 0
                    || targetNest.warIn > 0 || targetNest.larvae > 50;
                const damageMultiplier = (hasDefenders ? 1 : 2) * (1 + _nestAM * 0.5);

                // ✅ BUG2 FIX: thêm larvae và eggs vào targets
                const targets = ['queenHP','food','milk','nurse','scoutIn','warIn','larvae','eggs']
                    .filter(t => targetNest[t] > 0);

                let resourceTaken = false;
                if (targets.length > 0) {
                    const target = targets[randInt(0, targets.length - 1)];
                    if (target === 'queenHP') {
                        const queenDamage = 50 * damageMultiplier * Math.min(4, 1 / Math.max(targetNest.queenHP / MaxHP, 0.0001));
                        targetNest.queenHP = Math.max(0, targetNest.queenHP - queenDamage);
                    } else if (target === 'food') {
                        const foodTake = Math.min(Math.floor(randInt(20, 500)), targetNest.food) * damageMultiplier;
                        targetNest.food = Math.max(0, targetNest.food - foodTake);
                        ant.carrying = foodTake;
                        ant.targetNest = ant.homeNest;
                        resourceTaken = true;
                    } else if (target === 'milk') {
                        const milkTake = Math.min(Math.floor(randInt(20, 500)), targetNest.milk) * damageMultiplier;
                        targetNest.milk = Math.max(0, targetNest.milk - milkTake);
                        ant.carryingMilk = milkTake;
                        ant.targetNest = ant.homeNest;
                        resourceTaken = true;
                    } else if (target === 'nurse') {
                        // ✅ BUG1 FIX: trừ đều 5 loại nurse chuyên trách, cập nhật tổng
                        const dmg = Math.max(1, Math.floor(damageMultiplier));
                        const perType = Math.ceil(dmg / 5);
                        ['nurseProduction','nurseRoyal','nurseLarvae','nurseMushroom','nurseHome'].forEach(t => {
                            targetNest[t] = Math.max(0, targetNest[t] - perType);
                        });
                        targetNest.nurse = totalNurse(targetNest);
                    } else if (target === 'scoutIn') {
                        targetNest.scoutIn = Math.max(0, targetNest.scoutIn - 1 * damageMultiplier);
                    } else if (target === 'warIn') {
                        targetNest.warIn = Math.max(0, targetNest.warIn - 1 * damageMultiplier);
                    } else if (target === 'larvae') {
                        targetNest.larvae = Math.max(0, targetNest.larvae - Math.floor(2 * damageMultiplier));
                    } else if (target === 'eggs') {
                        targetNest.eggs = Math.max(0, targetNest.eggs - Math.floor(2 * damageMultiplier));
                    }
                } else {
                    // ✅ BUG4 FIX: targets = [] → tổ hoàn toàn trống → tấn công thẳng queenHP
                    const queenDamage = 100 * damageMultiplier;
                    targetNest.queenHP = Math.max(0, targetNest.queenHP - queenDamage);
                }

                ant.hp -= 1;
                if (ant.hp <= 0) ant.toRemove = true;
                ant.lastAttackTime = now;
                if (ant.hp > 0 && !resourceTaken) {
                    const dx = targetNest.x - ant.x;
                    const dy = targetNest.y - ant.y;
                    const distToNest = Math.hypot(dx, dy) || 1;
                    const knockbackForce = 14;
                    const knockbackSpeed = knockbackForce / 0.2;
                    ant.knockbackVelocity = { x: -(dx / distToNest) * knockbackSpeed, y: -(dy / distToNest) * knockbackSpeed };
                    ant.knockbackEndTime = now + 200;
                }
            }
        }

        function handleEggProduction(nest, now) {
            if (nest.queen <= 0) return;
            // Hard cap: không đẻ thêm nếu eggs đã đạt 5× max
            const eggsCap = MAX_ANTS_PER_NEST * EGGS_LAY_SLOW_RATIO;
            if (nest.eggs >= eggsCap) return;

            // Fertility tăng nhẹ theo milk (không bùng nổ)
            const milkBonus = Math.floor(nest.milk / 200);
            const fertility = nest.queenFertility * (1 + milkBonus);
            let eggsToLay = Math.max(1, Math.floor(nest.queen * fertility * (2 + milkBonus) * 2));

            // Giảm tốc khi eggs đang nhiều (75% cap → đẻ chậm dần)
            const fillRatio = nest.eggs / eggsCap;
            if (fillRatio > 0.75) eggsToLay = Math.max(1, Math.floor(eggsToLay * (1 - fillRatio)));

            const milkNeeded = eggsToLay * 3;
            if (nest.milk >= milkNeeded) {
                nest.milk = Math.max(0, nest.milk - milkNeeded);
                nest.eggs = Math.min(eggsCap, nest.eggs + eggsToLay);
            }
            if (nest.isDeleting && nest.food >= 1) {
                nest.food = Math.max(0, nest.food - 1);
                nest.queenHP = Math.min(MaxHP, nest.queenHP + 100);
            }
        }

        // Hồi HP queen từ nurse (chạy mỗi 1s)
        function handleQueenHeal(nest) {
            if (nest.queen <= 0) return;
            // nurseRoyal chăm queen: hồi HP tỉ lệ theo số lượng
            if (nest.queenHP < MaxHP && nest.nurseRoyal > 0 && nest.milk >= 1) {
                nest.milk = Math.max(0, nest.milk - 1);
                nest.queenHP = Math.min(MaxHP, nest.queenHP + nest.nurseRoyal * 0.5); // tỉ lệ nurseRoyal
            }
            // Bootstrap: queen hy sinh HP để tạo nurse khi còn quá ít
            const totalN = totalNurse(nest);
            if (totalN < 10) {
                if (nest.queenHP >= 10) {
                    // HP đủ → sinh 5 nurse một lúc
                    nest.queenHP -= 10;
                    distributeNewNurse(nest, 5);
                } else if (nest.queenHP > 0) {
                    // HP < 10 → chỉ sinh 1 nurse
                    nest.queenHP = Math.max(0, nest.queenHP - 2);
                    distributeNewNurse(nest, 1);
                }
            }
        }

        function hatchLarvae(nest, now) {
            const larvaeToHatch = Math.floor(nest.larvae * ((nest.isAttacking || nest.isDefending) ? 0.9 : (nest.isStarving ? 0.8 : 0.6)));
            if (larvaeToHatch <= 0) return;
            const totalN  = totalNurse(nest);
            const maxNurseTotal = MAX_NURSE_EACH * 5; // 250 tổng tối đa
            const maxScoutIn = (nest.isStarving || nest.isDeleting) ? SCOUT_IN_MULTIPLIER_STARVING * nest.maxScouts : nest.maxScouts;
            const _warOutNowCount = (nestAntCache.get(nest)?.warAndBom) || 0;
            const maxWarIn = nest.isDefending ? Math.max(_warOutNowCount * 8, 40) : (nest.isAttacking ? WAR_IN_MULTIPLIER_WAR * 100 : nest.maxWarAnts);
            const canConvertNurse   = totalN < maxNurseTotal;
            const canConvertScoutIn = nest.scoutIn < maxScoutIn;
            const canConvertWarIn   = nest.warIn < maxWarIn;
            if (!canConvertNurse && !canConvertScoutIn && !canConvertWarIn) return;
            let nurseRatio, scoutInRatio, warInRatio;
            if (nest.isDefending) {
                nurseRatio = 1; scoutInRatio = 1; warInRatio = 4;
            } else if (nest.isAttacking) {
                nurseRatio = 1; scoutInRatio = 1; warInRatio = 4;
            } else {
                nurseRatio = 3; scoutInRatio = 4; warInRatio = 3;
            }
            let adjustedNurseRatio   = canConvertNurse   ? nurseRatio   : 0;
            let adjustedScoutInRatio = canConvertScoutIn ? scoutInRatio : 0;
            let adjustedWarInRatio   = canConvertWarIn   ? warInRatio   : 0;
            let totalRatio = adjustedNurseRatio + adjustedScoutInRatio + adjustedWarInRatio;
            if (totalRatio === 0) return;
            let nonMaxCount = (canConvertNurse ? 1 : 0) + (canConvertScoutIn ? 1 : 0) + (canConvertWarIn ? 1 : 0);
            if (!canConvertNurse)   { const e = nurseRatio   / nonMaxCount; if (canConvertScoutIn) adjustedScoutInRatio += e; if (canConvertWarIn) adjustedWarInRatio += e; }
            if (!canConvertScoutIn) { const e = scoutInRatio / nonMaxCount; if (canConvertNurse)   adjustedNurseRatio   += e; if (canConvertWarIn) adjustedWarInRatio += e; }
            if (!canConvertWarIn)   { const e = warInRatio   / nonMaxCount; if (canConvertNurse)   adjustedNurseRatio   += e; if (canConvertScoutIn) adjustedScoutInRatio += e; }
            const minNurseCount  = canConvertNurse ? Math.min(1, larvaeToHatch, maxNurseTotal - totalN) : 0;
            const remainingLarvae = larvaeToHatch - minNurseCount;
            const nurseCount   = canConvertNurse   ? minNurseCount + Math.floor(remainingLarvae * adjustedNurseRatio   / totalRatio) : 0;
            const scoutInCount = canConvertScoutIn ? Math.floor(remainingLarvae * adjustedScoutInRatio / totalRatio) : 0;
            const warInCount   = canConvertWarIn   ? Math.floor(remainingLarvae * adjustedWarInRatio   / totalRatio) : 0;
            const totalHatched = nurseCount + scoutInCount + warInCount;
            const milkNeeded   = (nurseCount * 2) + (scoutInCount * 3) + (warInCount * 5);
            if (nest.milk >= milkNeeded && totalHatched > 0) {
                const actualNurse   = canConvertNurse   ? Math.min(nurseCount,   maxNurseTotal - totalN)       : 0;
                const actualScoutIn = canConvertScoutIn ? Math.min(scoutInCount, maxScoutIn - nest.scoutIn)     : 0;
                const actualWarIn   = canConvertWarIn   ? Math.min(warInCount,   maxWarIn    - nest.warIn)      : 0;
                const actualHatched = actualNurse + actualScoutIn + actualWarIn;
                if (actualHatched > 0) {
                    if (canConvertNurse)   distributeNewNurse(nest, actualNurse); // phân bổ đều 5 loại, ưu tiên từ trên
                    if (canConvertScoutIn) nest.scoutIn = Math.min(maxScoutIn, nest.scoutIn + actualScoutIn);
                    if (canConvertWarIn)   nest.warIn   = Math.min(maxWarIn,   nest.warIn   + actualWarIn);
                    const actualMilk = (actualNurse * 2) + (actualScoutIn * 3) + (actualWarIn * 5);
                    nest.larvae = Math.max(0, nest.larvae - actualHatched);
                    nest.milk   = Math.max(0, nest.milk   - actualMilk);
                }
            }
        }

        function checkNestFlooding(nest, now) {
            const floodingWater = waters.find(w =>
                w.amount > 150 && isPointInWater(nest.x, nest.y, w)
            );
            const dt = now - (nest.lastFloodCheck || now);
            if (floodingWater) {
                nest.floodDrownTime = (nest.floodDrownTime || 0) + dt;
                if (nest.floodDrownTime > 3000 && !nest.isFlooding) {
                    nest.isFlooding = true;           // Trạng thái phụ: ngập nước
                    nest._floodSource = floodingWater; // Nguồn nước gây ngập
                }
                if (nest.floodDrownTime > 8000) {     // Vẫn giữ cơ chế xoá tổ
                    if (!nest.isDeleting) {
                        nest.isDeleting = true;
                        nest.deletingStartTime = now;
                    }
                }
            } else {
                // Nước dao động (grow/shrink mỗi 3s) sẽ không reset bộ đếm ngay lập tức
                if (nest.floodDrownTime > 0) {
                    nest.floodDrownTime = Math.max(0, nest.floodDrownTime - dt * 0.5);
                }
                if (nest.floodDrownTime <= 0) {
                    nest.isFlooding = false;
                    nest._floodSource = null;
                }
            }
            nest.lastFloodCheck = now;
        }

        class Ant {
            constructor(x, y, type = "Larvae", homeNest) {
                this.x = x; this.y = y; this.type = type; this.carrying = 0; this.carryingMilk = 0;
                this.targetFood = null; this.targetNest = null; this.targetAnt = null;
                this.carryingWater = 0; this.targetWater = null;
                this.carryingWood = 0;
                this.direction = Math.random() * Math.PI * 2; this.randomDirection = Math.random() * Math.PI * 2;
                this.randomDirectionTime = 0; this.homeNest = homeNest; this.homeNestName = homeNest.name;
                this.color = type === "WarAnt" || type === "BomAnt" ? (homeNest.isAttacking ? "red" : homeNest.color) :
                            type === "ScoutWar" ? "red" : homeNest.color;
                const _ageMult = homeNest ? getNestAgeMult(homeNest) : 0;
                const _warMaxHP = 30 + Math.floor(_ageMult * 50); // 30→80 theo tuổi
                const _warRatio = homeNest.warHighHPRatio + _ageMult * 0.3; // ratio tăng theo tuổi
                this.hp = type === "WarAnt" ? (Math.random() < _warRatio ? _warMaxHP : 2 + Math.floor(_ageMult * 8)) : (type === "BomAnt" ? 50 + Math.floor(_ageMult * 30) : 1);
                this.lastAttackTime = Date.now(); this.knockbackVelocity = null; this.knockbackEndTime = 0;
                this.waterDrownTime = 0;
                this.lastUpdateTime = Date.now();
                this.isBomAnt = type === "BomAnt";
                this.explosionTime = null;
            }

            updateScout() {
                const now = Date.now();
                const _wm = getEnvMultipliers().speedMult;
                const speed = (this.homeNest.isStarving ? 5.25 : this.carrying > 0 || this.carryingWater > 0 || this.carryingWood > 0 ? 2.0 : 3.5) * _wm;
                if (this.type === "ScoutWar") {
                    if (!this.targetNest) return;
                    const dist = moveTowards.call(this, this.homeNest.x, this.homeNest.y, speed);
                    if (dist < 5 && this.targetNest && !this.targetNest.isDeleting) {
                        if (!this.homeNest.isAttacking && !this.homeNest.isDefending && !this.homeNest.isDeleting && !this.homeNest.isStarving) {
                            this.homeNest.isAttacking = true;
                            this.homeNest.attackTarget = this.targetNest;
                            this.homeNest.lastAttackActivation = now;
                            if (this.homeNest.warIn > 0) {
                                promoteAnts(this.homeNest, "WarAnt", randInt(1, 10), 100, 0, "lastWarAntConversion");
                            }
                        }
                        this.type = "scout";
                        this.color = this.homeNest.color;
                        this.targetNest = null;
                    }
                    return;
                }
                if (this.carrying > 0 || this.carryingWater > 0 || this.carryingWood > 0 || this.targetNest) {
                    // Dùng warp về tổ nếu warp gần hơn đường thẳng
                    const returnWarp = getShortestReturnWarp(this);
                    if (returnWarp) {
                        const distToWarp = Math.hypot(this.x - returnWarp.x, this.y - returnWarp.y);
                        if (distToWarp < 8) {
                            // Teleport về tổ
                            this.x = returnWarp.homeNest.x + randFloat(-8, 8);
                            this.y = returnWarp.homeNest.y + randFloat(-8, 8);
                            this._usingWarp = false;
                        } else {
                            this._usingWarp = true;
                            moveTowards.call(this, returnWarp.x, returnWarp.y, speed);
                            return;
                        }
                    }
                    this._usingWarp = false;
                    const dist = moveTowards.call(this, this.homeNest.x, this.homeNest.y, speed);
                    // Pheromone trail khi mang food HOẶC water → type 'food'
                    const _hasResource = (this.targetFood && (this.targetFood.amount > 0 || this.targetFood.wood > 0 || this.targetFood.isSpecial))
                                      || (this.carryingWater > 0 && this.targetWater);
                    if (_hasResource) {
                        if (!this._lastPhX) { this._lastPhX = this.x; this._lastPhY = this.y; }
                        const dotDist = Math.hypot(this.x - this._lastPhX, this.y - this._lastPhY);
                        if (dotDist >= 15) {
                            const lifetime = Math.max(16000, 60000 / getEnvMultipliers().decayMult);
                            const dot = {
                                x: this.x, y: this.y,
                                strength: 400, maxStrength: 400,
                                type: 'food',
                                food: this.targetFood || null,
                                water: this.targetWater || null,
                                homeNest: this.homeNest,
                                color: this.homeNest.color,
                                creationTime: now,
                                lifetime
                            };
                            if (pheromones.length < MAX_PHEROMONES) {
                                pheromones.push(dot);
                                addPheromoneToGrid(dot);
                            }
                            this._lastPhX = this.x;
                            this._lastPhY = this.y;
                        }
                    } else {
                        this._lastPhX = null; this._lastPhY = null;
                    }
                    if (dist < 5) {
                        if (this.carrying > 0) {
                            this.homeNest.food += this.carrying;
                            this.homeNest.water += Math.floor(this.carrying * 0.1);
                            this.carrying = 0;
                        }
                        if (this.carryingWater > 0) {
                            this.homeNest.water = this.homeNest.water + this.carryingWater;
                            this.carryingWater = 0;
                        }
                        if (this.carryingWood > 0) {
                            this.homeNest.wood += this.carryingWood;
                            this.carryingWood = 0;
                        }
                        this.targetFood = null;
                        this.targetWater = null;
                        this.targetNest = null;
                    }
                    return;
                }
                if (this.type === "scout") {
                    // Phát hiện tổ địch trực tiếp (phạm vi nhỏ 30px)
                    let foundEnemy = false;
                    for (const otherNest of nests) {
                        if (otherNest !== this.homeNest && !otherNest.isDeleting) {
                            const distToEnemy = Math.hypot(this.x - otherNest.x, this.y - otherNest.y);
                            if (distToEnemy < 30) {
                                this.type = "ScoutWar";
                                this.color = "red";
                                this.targetNest = otherNest;
                                this.targetFood = null; this.targetWater = null;
                                this.carrying = 0; this.carryingWater = 0; this.carryingWood = 0;
                                foundEnemy = true;
                                break;
                            }
                        }
                    }
                    // Chỉ phát hiện pheromone type:'nest' của tổ khác → ScoutWar
                    if (!foundEnemy && !this.carrying && !this.carryingWater && !this.carryingWood) {
                        const enemyTrails = getNearbyPheromones(this.x, this.y, 40)
                            .filter(p => p.type === 'nest' && p.homeNest && p.homeNest !== this.homeNest && !p.homeNest.isDeleting && p.strength > 30);
                        if (enemyTrails.length > 0) {
                            const target = enemyTrails[0].homeNest;
                            this.type = "ScoutWar";
                            this.color = "red";
                            this.targetNest = target;
                            this.targetFood = null; this.targetWater = null;
                            this.carrying = 0; this.carryingWater = 0; this.carryingWood = 0;
                        }
                    }
                }
                // Clear target nếu đã hết
                if (this.targetFood && (!foods.includes(this.targetFood) || (this.targetFood.amount <= 0 && this.targetFood.wood <= 0 && !this.targetFood.isSpecial))) {
                    this.targetFood = null;
                }
                if (this.targetWater && (this.targetWater.amount <= 0 || !waters.includes(this.targetWater))) {
                    this.targetWater = null;
                }
                if (!this.targetFood && !this.targetWater) {
                    let bestTarget = null, bestDist = Infinity, bestType = null;

                    // Pheromone của tổ mình → follow (chỉ food pheromone có target còn giá trị)
                    const nearbyDots = getNearbyPheromones(this.x, this.y, 180)
                        .filter(p => p.type === 'food' && p.homeNest === this.homeNest &&
                            ((p.food && (p.food.amount > 0 || p.food.wood > 0)) || (p.water && p.water.amount > 0))
                        );
                    nearbyDots.forEach(p => {
                        const d = Math.hypot(p.x - this.x, p.y - this.y);
                        if (d < bestDist) { bestDist = d; bestTarget = p; bestType = 'pheromone'; }
                    });

                    // Food gần nhất
                    const nearbyFoods = getNearbyObjects(this.x, this.y);
                    nearbyFoods.forEach(f => {

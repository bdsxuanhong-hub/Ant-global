                        if (f.amount <= 0 && f.wood <= 0 && !f.isSpecial) return;
                        const d = Math.hypot(f.x - this.x, f.y - this.y);
                        const detectRange = 30 + Math.min((f.amount + f.wood) / 50, 70);
                        if (d < detectRange && d < bestDist) {
                            bestDist = d; bestTarget = f; bestType = 'food';
                        }
                    });

                    // Water gần nhất — dùng waterGrid
                    getNearbyWaters(this.x, this.y).forEach(w => {
                        if (w.amount <= 100 || w.nonCollectable) return;
                        const dCenter = Math.hypot(w.x - this.x, w.y - this.y);
                        const approxEdgeR = Math.max(w.radiusX, w.radiusY);
                        // distToEdge: âm = đang trong water, 0 = đúng viền, dương = ngoài
                        const distToEdge = Math.max(0, dCenter - approxEdgeR);
                        const detectRange = 80; // 80px tính từ viền
                        if (distToEdge < detectRange && distToEdge < bestDist) {
                            bestDist = distToEdge; bestTarget = w; bestType = 'water';
                        }
                    });

                    if (bestType === 'food') {
                        this.targetFood = bestTarget;
                    } else if (bestType === 'water') {
                        this.targetWater = bestTarget;
                    } else if (bestType === 'pheromone') {
                        const p = bestTarget;
                        if (Math.hypot(p.x - this.x, p.y - this.y) < 12) {
                            p.strength = Math.min(p.maxStrength, p.strength + 30);
                            if (p.food && p.food.amount > 0) this.targetFood = p.food;
                            else if (p.water && p.water.amount > 0) this.targetWater = p.water;
                        } else {
                            moveTowards.call(this, p.x, p.y, speed);
                            return;
                        }
                    } else {
                        // Không có gì → warp ra ngoài hoặc random walk
                        if (!this._usingWarpOut && now - (this._lastWarpOutTime || 0) > 5000) {
                            const outWarp = getScoutWarpOut(this);
                            if (outWarp) {
                                const dw = Math.hypot(this.x - outWarp.x, this.y - outWarp.y);
                                if (dw < 8) {
                                    const angle = Math.atan2(outWarp.y - this.homeNest.y, outWarp.x - this.homeNest.x);
                                    this.x = outWarp.x + Math.cos(angle) * 20;
                                    this.y = outWarp.y + Math.sin(angle) * 20;
                                    this._usingWarpOut = false;
                                    this._lastWarpOutTime = now;
                                } else {
                                    this._usingWarpOut = true;
                                    moveTowards.call(this, outWarp.x, outWarp.y, speed);
                                    return;
                                }
                            } else { this._usingWarpOut = false; }
                        }
                        if (now - this.randomDirectionTime > 600 || this.x <= 10 || this.x >= WORLD_WIDTH-10 || this.y <= 10 || this.y >= WORLD_HEIGHT-10) {
                            this.randomDirection = Math.random() * Math.PI * 2;
                            this.randomDirectionTime = now;
                        }
                        const wx = Math.max(10, Math.min(WORLD_WIDTH-10, this.x + Math.cos(this.randomDirection) * speed * 25));
                        const wy = Math.max(10, Math.min(WORLD_HEIGHT-10, this.y + Math.sin(this.randomDirection) * speed * 25));
                        moveTowards.call(this, wx, wy, speed);
                    }
                }
                if (this.targetWater) {
                    if (this.targetWater.nonCollectable) {
                        this.targetWater = null;
                        return;
                    }
                    const _edge = getWaterEdgePoint(this.targetWater, this.x, this.y);
                    const dist = moveTowards.call(this, _edge.x, _edge.y, speed);
                    // Thu thập khi chạm viền ellipse nước
                    const _canPickup = isPointInWater(this.x, this.y, this.targetWater) || dist < 6;
                    if (_canPickup) {
                        // Đánh dấu marker trên water
                        if (!this._lastMarkerWater || this._lastMarkerWater !== this.targetWater) {
                            const mLifetime = Math.max(20000, 80000 / getEnvMultipliers().decayMult);
                            const marker = {
                                x: this.targetWater.x, y: this.targetWater.y,
                                strength: 500, maxStrength: 500,
                                type: 'food',
                                food: null, water: this.targetWater,
                                homeNest: this.homeNest,
                                color: this.homeNest.color,
                                creationTime: now,
                                lifetime: mLifetime,
                                isMarker: true
                            };
                            if (pheromones.length < MAX_PHEROMONES) {
                                pheromones.push(marker);
                                addPheromoneToGrid(marker);
                            }
                            this._lastMarkerWater = this.targetWater;
                        }
                        const take = Math.min(randInt(10, 300), this.targetWater.amount);
                        if (take > 0) {
                            this.carryingWater = take;
                            this.targetWater.amount -= take;
                            updateWaterRegion(this.targetWater);
                        } else {
                                    this.targetWater = null;
                            this._avoidingWater = null;
                            // Di chuyển ra ngoài theo hướng về tổ
                            const escapeAngle = Math.atan2(this.homeNest.y - this.y, this.homeNest.x - this.x);
                            this.x = Math.max(10, Math.min(WORLD_WIDTH-10, this.x + Math.cos(escapeAngle) * speed * 3));
                            this.y = Math.max(10, Math.min(WORLD_HEIGHT-10, this.y + Math.sin(escapeAngle) * speed * 3));
                        }
                    }
                    return;
                }
                if (this.targetFood) {
                    const dist = moveTowards.call(this, this.targetFood.x, this.targetFood.y, speed);
                    const foodPickupRadius = getFoodPickupRadius(this.targetFood.amount, currentSeason);
                    if (dist < foodPickupRadius) {
                        // Đánh dấu pheromone trực tiếp lên target (marker) — tồn tại độc lập với amount
                        if (!this._lastMarkerFood || this._lastMarkerFood !== this.targetFood) {
                            const mLifetime = Math.max(20000, 80000 / getEnvMultipliers().decayMult);
                            const marker = {
                                x: this.targetFood.x, y: this.targetFood.y,
                                strength: 500, maxStrength: 500,
                                type: 'food',
                                food: this.targetFood, water: null,
                                homeNest: this.homeNest,
                                color: this.homeNest.color,
                                creationTime: now,
                                lifetime: mLifetime,
                                isMarker: true // không bị xóa khi food hết, chỉ hết hạn
                            };
                            if (pheromones.length < MAX_PHEROMONES) {
                                pheromones.push(marker);
                                addPheromoneToGrid(marker);
                            }
                            this._lastMarkerFood = this.targetFood;
                        }
                        const takeFrom = Math.random() < 0.5 ? 'amount' : 'wood';
                        const _scoutAM = this.homeNest ? getNestAgeMult(this.homeNest) : 0;
                        const _maxCarry = Math.floor(150 + _scoutAM * 250); // 150→400 theo tuổi
                        const take = Math.min(randInt(10, _maxCarry), this.targetFood[takeFrom]);
                        if (take > 0) {
                            this.targetFood[takeFrom] -= take;
                            if (takeFrom === 'amount') {
                                this.carrying = take;
                            } else {
                                this.carryingWood = take;
                            }
                        } else {
                            this.targetFood = null;
                        }
                    }
                }
            }

            updateHomeAndWarAnt() {
                const now = Date.now();
                if (this.type === "Larvae") return;
                if (this.type === "WarAnt" || this.type === "BomAnt") {
                    if (!this.homeNest) return;
                    const distToNest = Math.hypot(this.x - this.homeNest.x, this.y - this.homeNest.y);
                    this.color = this.homeNest.isAttacking ? "red" : this.homeNest.color;

                    if (this.carrying > 0 || this.carryingMilk > 0) {
                        const speed = 2;
                        const distToHome = moveTowards.call(this, this.homeNest.x, this.homeNest.y, speed);
                        if (distToHome < 5) {
                            this.homeNest.food += this.carrying || 0;
                            this.homeNest.milk += this.carryingMilk || 0;
                            this.carrying = 0; this.carryingMilk = 0;
                            const _am = this.homeNest ? getNestAgeMult(this.homeNest) : 0;
                            const _wmhp = 30 + Math.floor(_am * 50);
                            const _wr = this.homeNest.warHighHPRatio + _am * 0.3;
                            this.hp = Math.random() < _wr ? _wmhp : 2 + Math.floor(_am * 8);
                            if (this.isBomAnt) this.hp = 50;
                            this.targetNest = this.homeNest.attackTarget;
                            this.targetAnt = null;
                            this.knockbackVelocity = null;
                            this.knockbackEndTime = 0;
                        }
                        return;
                    }
                    if (this.knockbackVelocity && now < this.knockbackEndTime) {
                        this.x += this.knockbackVelocity.x * (1/60);
                        this.y += this.knockbackVelocity.y * (1/60);
                        this.x = Math.max(10, Math.min(WORLD_WIDTH - 10, this.x));
                        this.y = Math.max(10, Math.min(WORLD_HEIGHT - 10, this.y));
                        return;
                    } else {
                        this.knockbackVelocity = null;
                        this.knockbackEndTime = 0;
                    }
                    if (this.homeNest.isDefending) {
                        const nearbyEnemies = getNearbyAnts(this.x, this.y, this.homeNest.warAntDetectionRadius)
                            .filter(a => (a.type === "WarAnt" || a.type === "BomAnt") && a.homeNest !== this.homeNest &&
                                Math.hypot(a.x - this.x, a.y - this.y) < this.homeNest.warAntDetectionRadius);
                        // Stones trong tầm đánh
                        const nearbyStones = obstacles.filter(o =>
                            o.type === 'stone' && o.hp > 0 &&
                            Math.hypot(o.x - this.x, o.y - this.y) < STONE_ATTACK_RANGE
                        );
                        const speed = (nearbyEnemies.length > 0 || nearbyStones.length > 0) ? 3 : 2;
                        if (nearbyEnemies.length > 0) {
                            this.targetAnt = nearbyEnemies.reduce((closest, a) => {
                                if (!closest) return a;
                                const distA = Math.hypot(a.x - this.x, a.y - this.y);
                                const distC = Math.hypot(closest.x - this.x, closest.y - this.y);
                                return distA < distC ? a : closest;
                            }, null);
                            if (this.targetAnt) {
                                moveTowards.call(this, this.targetAnt.x, this.targetAnt.y, speed);
                                attackEnemy(this, nearbyEnemies, now);
                            }
                        } else if (nearbyStones.length > 0) {
                            attackNearbyStones(this, nearbyStones, now);
                        } else if (this._targetStone && this._targetStone.hp > 0) {
                            // Di chuyển đến stone được gán trong defenseRadius
                            moveTowards.call(this, this._targetStone.x, this._targetStone.y, speed);
                        } else {
                            this._targetStone = null;
                            if (distToNest < centerRadius || distToNest > this.homeNest.defenseRadius) {
                                moveToBoundaryCircle.call(this, this.homeNest, speed, centerRadius, this.homeNest.defenseRadius);
                            } else {
                                moveInCircleWithReflection.call(this, this.homeNest, speed, centerRadius, this.homeNest.defenseRadius);
                            }
                            this.targetAnt = null;
                            this.targetNest = null;
                        }
                    } else if (this.homeNest.isAttacking && this.homeNest.attackTarget) {
                        const targetNest = this.homeNest.attackTarget;
                        const distToTargetNest = Math.hypot(this.x - targetNest.x, this.y - targetNest.y);
                        const nearbyEnemies = getNearbyAnts(this.x, this.y, this.homeNest.warAntDetectionRadius)
                            .filter(a => (a.type === "WarAnt" || a.type === "BomAnt") && a.homeNest !== this.homeNest &&
                                Math.hypot(a.x - this.x, a.y - this.y) < this.homeNest.warAntDetectionRadius);
                        const nearbyStones = obstacles.filter(o =>
                            o.type === 'stone' && o.hp > 0 &&
                            Math.hypot(o.x - this.x, o.y - this.y) < STONE_ATTACK_RANGE
                        );
                        const speed = nearbyEnemies.length > 0 ? 3 : 2;
                        if (distToTargetNest > targetNest.defenseRadius) {
                            moveTowards.call(this, targetNest.x, targetNest.y, speed);
                        } else {
                            if (nearbyEnemies.length > 0) {
                                this.targetAnt = nearbyEnemies.reduce((closest, a) => {
                                    if (!closest) return a;
                                    const distA = Math.hypot(a.x - this.x, a.y - this.y);
                                    const distC = Math.hypot(closest.x - this.x, closest.y - this.y);
                                    return distA < distC ? a : closest;
                                }, null);
                                if (this.targetAnt) {
                                    moveTowards.call(this, this.targetAnt.x, this.targetAnt.y, speed);
                                    attackEnemy(this, nearbyEnemies, now);
                                }
                            } else if (nearbyStones.length > 0) {
                                attackNearbyStones(this, nearbyStones, now);
                            } else {
                                attackTargetNest(this, targetNest, speed, now);
                            }
                        }
                    } else {
                        const nearbyEnemies = ants.filter(a => (a.type === "scout" || a.type === "ScoutWar" || a.type === "WarAnt" || a.type === "QueenAnt" || a.type === "BomAnt") && a.homeNest !== this.homeNest &&
                            Math.hypot(a.x - this.x, a.y - this.y) < this.homeNest.warAntDetectionRadius);
                        const nearbyStones = obstacles.filter(o =>
                            o.type === 'stone' && o.hp > 0 &&
                            Math.hypot(o.x - this.x, o.y - this.y) < STONE_ATTACK_RANGE
                        );
                        const speed = nearbyEnemies.length > 0 ? 3 : 2;
                        if (nearbyEnemies.length > 0) {
                            this.targetAnt = nearbyEnemies.reduce((closest, a) => {
                                if (!closest) return a;
                                const distA = Math.hypot(a.x - this.x, a.y - this.y);
                                const distC = Math.hypot(closest.x - this.x, closest.y - this.y);
                                return distA < distC ? a : closest;
                            }, null);
                            if (this.targetAnt) {
                                moveTowards.call(this, this.targetAnt.x, this.targetAnt.y, speed);
                                attackEnemy(this, nearbyEnemies, now);
                                if (this.targetAnt.toRemove) {
                                    this.targetAnt = null;
                                    moveToBoundaryCircle.call(this, this.homeNest, speed, centerRadius, this.homeNest.defenseRadius);
                                }
                            }
                        } else if (nearbyStones.length > 0) {
                            attackNearbyStones(this, nearbyStones, now);
                        } else {
                            if (distToNest < centerRadius || distToNest > this.homeNest.defenseRadius) {
                                moveToBoundaryCircle.call(this, this.homeNest, speed, centerRadius, this.homeNest.defenseRadius);
                            } else {
                                moveInCircleWithReflection.call(this, this.homeNest, speed, centerRadius, this.homeNest.defenseRadius);
                            }
                            this.targetAnt = null;
                            this.targetNest = null;
                        }
                    }
                }
            }

            update() {
                const now = Date.now();
                if (this.targetFood && (!foods.includes(this.targetFood) ||
                    (this.targetFood.amount <= 0 && this.targetFood.wood <= 0 && !this.targetFood.isSpecial))) {
                    this.targetFood = null;
                }
                if (this.targetWater && (!waters.includes(this.targetWater) || this.targetWater.amount <= 0)) {
                    this.targetWater = null;
                }
                if (this.targetNest && (!nests.includes(this.targetNest) || this.targetNest.toRemove)) {
                    this.targetNest = null;
                }
                if (this.targetAnt && (!ants.includes(this.targetAnt) || this.targetAnt.toRemove)) {
                    this.targetAnt = null;
                }
                if (!this.targetFood && !this.targetWater && !this.targetNest && !this.targetAnt &&
                    this.carrying === 0 && this.carryingWater === 0 && this.carryingWood === 0 &&
                    this.carryingMilk === 0) {
                    if (now - (this.randomDirectionTime || 0) > 20000) {
                        this.randomDirection = Math.random() * Math.PI * 2;
                        this.randomDirectionTime = now;
                    }
                }
                if (this.isBomAnt && this.explosionTime !== null) {
                    if (now - this.explosionTime >= 500) {
                        // Nổ sau 2s kể từ khi bị đánh lần đầu
                        const ATTACK_RADIUS = 35;
                        const DEFEND_RADIUS = 50;
                        const explosionRadius = this.homeNest.isDefending ? DEFEND_RADIUS : ATTACK_RADIUS;
                        explosions.push({ x: this.x, y: this.y, creationTime: now, radius: explosionRadius, type: "mist" });
                        if (this.homeNest.isAttacking) {
                            ants.forEach(a => {
                                if (a !== this && Math.hypot(a.x - this.x, a.y - this.y) <= ATTACK_RADIUS) {
                                    a.hp -= (a.homeNest === this.homeNest) ? 1 : 100;
                                }
                            });
                        }
                        if (this.homeNest.isDefending) {
                            ants.forEach(a => {
                                if (a !== this && Math.hypot(a.x - this.x, a.y - this.y) <= DEFEND_RADIUS) {
                                    a.hp -= (a.homeNest === this.homeNest) ? 0 : 40;
                                }
                            });
                            waters.push({ x: this.x, y: this.y, amount: 500, maxAmount: 500,
                                shapeAngle: randFloat(0, Math.PI*2), shapeRatio: randFloat(0.3,5),
                                radiusX: 0, radiusY: 0, isPuddle: true, nonCollectable: true, creationTime: now });
                            updateWaterRegion(waters[waters.length - 1]);
                            addToWaterGrid(waters[waters.length - 1]);
                        }
                        this.toRemove = true;
                    }
                    return;
                }
                if (this.isBomAnt) {
                    // Arm khi bị giảm máu (hp thấp hơn lần check trước)
                    const prevHp = this._bomPrevHp ?? this.hp;
                    if (this.hp < prevHp && this.explosionTime === null) {
                        this.explosionTime = now; // bắt đầu đếm ngược 2s
                    }
                    this._bomPrevHp = this.hp;
                }
                if (this.hp <= 0) {
                    this.toRemove = true;
                    return;
                }
                if (this.type === "scout" || this.type === "ScoutWar") this.updateScout();
                else this.updateHomeAndWarAnt();
                if (this.type === "WarAnt" || this.type === "BomAnt") {
                    let enemies = [];
                    const _nearRadius = Math.max(attackRadius, this.homeNest.warAntDetectionRadius);
                    const _nearAll = getNearbyAnts(this.x, this.y, _nearRadius);
                    const nearbyScouts   = _nearAll.filter(e => (e.type === "scout" || e.type === "ScoutWar") && e.homeNest !== this.homeNest && Math.hypot(e.x - this.x, e.y - this.y) < attackRadius);
                    const nearbyWarAnts  = _nearAll.filter(e => (e.type === "WarAnt" || e.type === "BomAnt") && e.homeNest !== this.homeNest && Math.hypot(e.x - this.x, e.y - this.y) < this.homeNest.warAntDetectionRadius);
                    const nearbyQueens   = _nearAll.filter(e => e.type === "QueenAnt" && e.homeNest !== this.homeNest && Math.hypot(e.x - this.x, e.y - this.y) < attackRadius);
                    if (this.homeNest.isDefending) enemies = nearbyWarAnts;
                    else if (this.homeNest.isAttacking && this.homeNest.attackTarget) enemies = nearbyScouts.length > 0 ? nearbyScouts : nearbyQueens.length > 0 ? nearbyQueens : nearbyWarAnts;
                    else enemies = [...nearbyWarAnts, ...nearbyScouts, ...nearbyQueens];
                    attackEnemy(this, enemies, now);
                }
            }
        }

        class QueenAnt extends Ant {
            constructor(x, y, homeNest) {
                super(x, y, "QueenAnt", homeNest);
                this.color = homeNest.color;
                this.direction = Math.random() * Math.PI * 2;
            }
            update() {
                if (this.hp <= 0) { this.toRemove = true; return; }
                if (this.homeNest.isDefending) { this.type = "scout"; this.targetFood = null; this.carrying = 0; this.color = this.homeNest.color; return; }
                const speed = 3;
                if (this.carrying) {
                    // Bay về tổ thẳng — không bị cản
                    const dx = this.homeNest.x - this.x;
                    const dy = this.homeNest.y - this.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    if (dist < 5) {
                        this.homeNest.food += this.carrying;
                        this.homeNest.water += Math.floor(this.carrying * 0.4);
                        this.carrying = 0;
                        this.type = "scout";
                        this.targetFood = null;
                        this.color = this.homeNest.color;
                    } else {
                        this.x = Math.max(10, Math.min(WORLD_WIDTH - 10, this.x + (dx / dist) * 9.0));
                        this.y = Math.max(10, Math.min(WORLD_HEIGHT - 10, this.y + (dy / dist) * 9.0));
                    }
                    return;
                }
                // Bay tự do — đổi hướng ngẫu nhiên, đẩy ra xa tổ địch
                if (Math.random() < 0.1) this.direction += Math.random() * Math.PI - Math.PI / 2;
                let repulsionX = 0, repulsionY = 0;
                const repulsionRadius = 100, repulsionStrength = 0.05;
                nests.forEach(n => { if (n !== this.homeNest) {
                    const dx = this.x - n.x; const dy = this.y - n.y; const dist = Math.hypot(dx, dy) || 1;
                    if (dist < repulsionRadius) { const force = repulsionStrength * (1 - dist / repulsionRadius); repulsionX += (dx / dist) * force; repulsionY += (dy / dist) * force; }
                }});
                if (repulsionX !== 0 || repulsionY !== 0) this.direction = Math.atan2(repulsionY, repulsionX);
                // Di chuyển thẳng — không kiểm tra obstacle/water
                this.x = Math.max(10, Math.min(WORLD_WIDTH - 10, this.x + Math.cos(this.direction) * speed));
                this.y = Math.max(10, Math.min(WORLD_HEIGHT - 10, this.y + Math.sin(this.direction) * speed));
                // Phản xạ tường biên
                if (this.x <= 10) this.direction = Math.random() * Math.PI - Math.PI / 2;
                else if (this.x >= WORLD_WIDTH - 10) this.direction = Math.PI + (Math.random() * Math.PI - Math.PI / 2);
                else if (this.y <= 10) this.direction = Math.PI / 2 + (Math.random() * Math.PI - Math.PI / 2);
                else if (this.y >= WORLD_HEIGHT - 10) this.direction = -Math.PI / 2 + (Math.random() * Math.PI - Math.PI / 2);

                const nearbyFoods = getNearbyObjects(this.x, this.y);
                for (const food of nearbyFoods) {
                    if ((food.amount > 0 || food.wood > 0 || food.isSpecial) && Math.hypot(food.x - this.x, food.y - this.y) < 10) {
                        const tooClose = nests.some(n =>
                            n !== this.homeNest &&
                            Math.hypot(n.x - this.x, n.y - this.y) < MIN_DISTANCE_BETWEEN_NESTS
                        );
                        if (!tooClose && nests.length < MAX_NESTS_TOTAL) {
                            const newNest = createNewNest(this.x, this.y);
                            nests.push(newNest);
                            initializeNestAnts(newNest);
                            this.hp -= 1;
                            if (this.hp <= 0) this.toRemove = true;
                            food.amount = Math.max(0, food.amount - 400);
                        } else {
                            this.carrying = 1;
                            this.targetFood = food;
                        }
                        break;
                    }
                }
            }
        }

        function createNewNest(x, y) {
            const name = nestNames[nests.length];
            const queenConsumption = randFloat(1, 2.5);
            const initialFood = randInt(10, 15);
            const nest = {
                x: x + Math.cos(Math.random() * Math.PI * 2) * randInt(20, 50),
                y: y + Math.sin(Math.random() * Math.PI * 2) * randInt(20, 50),
                name, food: initialFood, milk: initialFood,
                water: initialFood * 2,
                waterMax: 20000,
                wood: 5,
                mushroom: 5,
                queen: 1,
                maxScouts: MAX_SCOUTS,
                maxWarAnts: MAX_WAR_ANTS,
                maxEggs: randInt(MAX_EGGS_INITIAL.min, MAX_EGGS_INITIAL.max),
                queenHP: Math.min(randInt(100, 300), MaxHP) + queenConsumption,
                queenFertility: randFloat(0.5, 1), queenConsumption,
                config: { scoutRatio: randFloat(0.1, 0.3), scoutBurstInterval: randInt(4000, 10000) },
                lastScoutBurst: Date.now(), color: getUniqueColor(), ants: [], lastWorkerDispatch: Date.now(),
                isAttacking: false, attackTarget: null, isDefending: false, isDeleting: false, deletingStartTime: null,
                isStarving: false, starvingStartTime: null, deathTime: null, eggs: 0, larvae: 0,
                // ── 5 loại Nurse chuyên trách (mỗi loại max 100) ──
                nurse: 0,            // tổng nurse (legacy — bằng tổng 5 loại dưới)
                nurseProduction: 0,  // sản xuất milk
                nurseRoyal: 0,       // chăm queen + trứng
                nurseLarvae: 0,      // nuôi dưỡng larvae
                nurseMushroom: 0,    // chăm mushroom
                nurseHome: 0,        // xây tổ, mở rộng defenseRadius
                scoutIn: 0, warIn: 0,
                warHighHPRatio: randFloat(0.05, 0.10),
                defenseRadius: centerRadius + 15, // khởi tạo mức tối thiểu, sẽ cập nhật sau 5s đầu
                lastQueenAction: Date.now(), lastHomeAntConsumption: Date.now(), creationTime: Date.now(),
                lastQueenAntSpawn: Date.now(), lastWarAntConversion: Date.now(), lastDefAntDispatch: Date.now(),
                noAttackersSince: null, lastQueenAttackFoodDeduction: Date.now(), normalStateStartTime: null,
                lastAttackActivation: Date.now(), lastEggHatch: Date.now(), lastLarvaeHatch: Date.now(),
                lastWarAntFlush: null, lastScoutNurseCleanup: Date.now(),
                floodDrownTime: 0,
                lastFloodCheck: Date.now(),
                isFlooding: false,
                _floodSource: null,
                lastBomAntPromotion: Date.now(),
                lastNestPheromone: Date.now(),
                // nurseHome animation state
                _nurseHomeRetreating: false,
                _nurseHomeR: null,          // bán kính hiện tại của parade (easing)
                _nurseHomePhase: 'idle',    // 'out' | 'patrol' | 'in' | 'idle'
                _nurseHomePhaseStart: 0,    // timestamp bắt đầu phase hiện tại
                _nurseHomeLastR: null,      // defenseRadius lần trước — detect thay đổi
                // 🧠 AI System
                ai: { currentAction: 'IDLE' },
            };
            return nest;
        }

        function initializeNestAnts(nest) {
            const numAnts = randInt(5, 10);
            let scoutCount = (nestAntCache.get(nest)?.scouts) || 0;
            for (let i = 0; i < numAnts && scoutCount < 40; i++) {
                const type = i < Math.ceil(numAnts * nest.config.scoutRatio) && scoutCount < 40 ? "scout" : "Larvae";
                const ant = new Ant(nest.x, nest.y, type, nest);
                nest.ants.push(ant); ants.push(ant);
                if (type === "scout") scoutCount++;
            }
            _antCacheDirty = true;
            nest.larvae = Math.max(0, randInt(5, 10));
            distributeNewNurse(nest, randInt(2, 5)); // phân bổ đều 5 loại
            nest.scoutIn = Math.max(0, randInt(2, 5));
            nest.warIn = Math.max(0, randInt(1, 3));
        }

        function promoteAnts(nest, type, count, maxCount, interval, lastDispatchKey) {
            const now = Date.now();
            const sourcePool = type === "scout" ? nest.scoutIn : nest.warIn;
            const _nc = nestAntCache.get(nest);
            const currentCount = _nc ? (type === "scout" ? _nc.scouts : (type === "BomAnt" ? _nc.bomAnts : _nc.warAndBom)) : 0;
            if (sourcePool > 0 && now - nest[lastDispatchKey] >= interval && currentCount < maxCount) {
                const promoteCount = Math.min(count, sourcePool, maxCount - currentCount);
                for (let i = 0; i < promoteCount; i++) {
                    const ant = new Ant(nest.x, nest.y, type, nest);
                    ant.color = type === "WarAnt" || type === "BomAnt" ? (nest.isAttacking ? "red" : nest.color) : nest.color;
                    if ((type === "WarAnt" || type === "BomAnt") && nest.isAttacking && nest.attackTarget) {
                        ant.targetNest = nest.attackTarget;
                        ant.x += randFloat(-10, 10);
                        ant.y += randFloat(-10, 10);
                        nest.milk = Math.max(0, nest.milk - 4);   // x2
                        nest.food = Math.max(0, nest.food - 2);   // x2
                    }
                    // x2 milk cost khi promote (scout hoặc warAnt)
                    if (type === "scout") nest.milk = Math.max(0, nest.milk - 6);   // 3→6
                    else if (type === "WarAnt" || type === "BomAnt") nest.milk = Math.max(0, nest.milk - 10); // 5→10
                    if (type === "WarAnt" || type === "BomAnt") ant.direction = Math.random() * Math.PI * 2;
                    if ((type === "WarAnt" || type === "BomAnt") && nest.wood >= 10) {
                        ant.hp += 20;
                        nest.wood -= 10;
                    }
                    nest.ants.push(ant); ants.push(ant);
                }
                _antCacheDirty = true;
                if (type === "scout") nest.scoutIn = Math.max(0, nest.scoutIn - promoteCount);
                else if (type === "WarAnt" || type === "BomAnt") nest.warIn = Math.max(0, nest.warIn - promoteCount);
                nest[lastDispatchKey] = now;
            }
        }

        function updateNestStates(nest, now) {
            checkNestFlooding(nest, now);
            const warAntCount = (nestAntCache.get(nest)?.warAndBom) || 0;
            // defenseRadius được cập nhật riêng mỗi 5s (không tính mỗi frame)
            nest.warAntDetectionRadius = nest.defenseRadius;
            if (now - nest.lastScoutNurseCleanup >= 40000) {
                ants = ants.filter(a => {
                    if (a.homeNest !== nest || a.type !== "scout") return true;
                    const isIdle = a.carrying === 0 && a.carryingWater === 0;
                    const isInWater = waters.some(w =>
                        w.amount > 150 && isPointInWater(a.x, a.y, w)
                    );
                    return !(isIdle || isInWater);
                });
                _antCacheDirty = true;
                // Giảm đều 5 loại nurse khi cleanup (2 mỗi loại = 10 tổng)
                ['nurseProduction','nurseRoyal','nurseLarvae','nurseMushroom','nurseHome'].forEach(t => {
                    nest[t] = Math.max(0, nest[t] - 2);
                });
                nest.nurse = totalNurse(nest);
                nest.lastScoutNurseCleanup = now;
            }
            if (nest.isDeleting) {
                // Đẩy eggs/larvae thành scout khi đang xóa
                const scoutCount = (nestAntCache.get(nest)?.scouts) || 0;
                if (scoutCount < nest.maxScouts) {
                    const slots = nest.maxScouts - scoutCount;
                    if (nest.eggs > 0) {
                        const eggsToHatch = Math.min(nest.eggs, slots);
                        for (let i = 0; i < eggsToHatch; i++) {
                            const ant = new Ant(nest.x, nest.y, "scout", nest);
                            nest.ants.push(ant); ants.push(ant);
                        }
                        nest.eggs = Math.max(0, nest.eggs - eggsToHatch);
                        _antCacheDirty = true;
                    } else if (nest.larvae > 0) {
                        const larvaeToHatch = Math.min(nest.larvae, slots);
                        for (let i = 0; i < larvaeToHatch; i++) {
                            const ant = new Ant(nest.x, nest.y, "scout", nest);
                            nest.ants.push(ant); ants.push(ant);
                        }
                        nest.larvae = Math.max(0, nest.larvae - larvaeToHatch);
                        _antCacheDirty = true;
                    }
                }
                if (now - nest.deletingStartTime >= 8000) {
                    // Thoát isDeleting chỉ khi CẢ BA điều kiện OK: có food/milk VÀ queen còn sống VÀ không ngập
                    const canRecover = (nest.food >= 1 || nest.milk >= 1)
                                    && nest.queenHP > 0
                                    && nest.floodDrownTime <= 0;
                    if (canRecover) {
                        nest.isDeleting = false; nest.deletingStartTime = null;
                        nest.isStarving = false; nest.starvingStartTime = null;
                        nest.isDefending = false; nest.noAttackersSince = null;
                        nest.isAttacking = false; nest.attackTarget = null;
                        nest.normalStateStartTime = now;
                    } else {
                        ants = ants.filter(a => a.homeNest !== nest);
                        _antCacheDirty = true;
                        nest.toRemove = true;
                    }
                }
                return;
            }
            if (nest.food < 1 && !nest.isStarving && !nest.isDeleting) {
                nest.isStarving = true;
                nest.starvingStartTime = now;
            }
            if (nest.isStarving) {
                if (now - nest.starvingStartTime >= 12000) {
                    if (nest.food > 2 * (totalNurse(nest) + nest.warIn + nest.scoutIn)) {
                        nest.isStarving = false; nest.starvingStartTime = null; nest.normalStateStartTime = now;
                    } else {
                        nest.starvingStartTime = now;
                    }
                }
            }
            if (nest.food < 1 && nest.milk < 1 && nest.queenHP <= 0 && !nest.isDeleting) {
                nest.isDeleting = true; nest.deletingStartTime = now;
                nest.isStarving = false; nest.starvingStartTime = null;
                nest.isDefending = false; nest.noAttackersSince = null;
                nest.isAttacking = false; nest.attackTarget = null;
                return;
            }
            if (now - (nest._lastStateCheck || 0) >= 250) {
                nest._lastStateCheck = now;
            const isUnderAttack = ants.some(a => (a.type === "WarAnt" || a.type === "BomAnt") && a.homeNest !== nest &&
                Math.hypot(a.x - nest.x, a.y - nest.y) < nest.defenseRadius) ||
                obstacles.some(o => o.type === 'stone' && o.hp > 0 &&
                Math.hypot(o.x - nest.x, o.y - nest.y) < nest.defenseRadius);
            if (isUnderAttack && !nest.isDefending && !nest.isDeleting) {
                if (nest.isAttacking) {
                    nest.isAttacking = false; nest.attackTarget = null;
                    ants.filter(a => a.homeNest === nest && (a.type === "WarAnt" || a.type === "BomAnt")).forEach(a => { a.targetNest = null; a.targetAnt = null; });
                }
                nest.isDefending = true; nest.noAttackersSince = null; nest.normalStateStartTime = null;
                ants.filter(a => a.homeNest === nest && (a.type === "WarAnt" || a.type === "BomAnt")).forEach(a => {
                    const distToNest = Math.hypot(a.x - nest.x, a.y - nest.y);
                    if (distToNest > centerRadius) moveTowards.call(a, nest.x, nest.y, 3);
                    a.targetNest = null; a.targetAnt = null;
                });
            }
            if (nest.isDefending) {
                promoteAnts(nest, "WarAnt", 10, 50, 250, "lastDefAntDispatch");
                const attackersInOrbit = ants.some(a => (a.type === "WarAnt" || a.type === "BomAnt") && a.homeNest !== nest &&
                    Math.hypot(a.x - nest.x, a.y - nest.y) < 25) || nests.some(n => n !== nest && !n.isDeleting && Math.hypot(n.x - nest.x, n.y - nest.y) < 25) ||
                    obstacles.some(o => o.type === 'stone' && o.hp > 0 && Math.hypot(o.x - nest.x, o.y - nest.y) < nest.defenseRadius);
                // WarAnt hướng đến stone gần nhất trong defenseRadius nếu không có địch
                const stonesInRadius = obstacles.filter(o => o.type === 'stone' && o.hp > 0 && Math.hypot(o.x - nest.x, o.y - nest.y) < nest.defenseRadius);
                if (stonesInRadius.length > 0) {
                    ants.filter(a => a.homeNest === nest && (a.type === "WarAnt" || a.type === "BomAnt") && !a.targetAnt).forEach(a => {
                        const nearest = stonesInRadius.reduce((best, o) => {
                            const d = Math.hypot(o.x - a.x, o.y - a.y);
                            return (!best || d < Math.hypot(best.x - a.x, best.y - a.y)) ? o : best;
                        }, null);
                        if (nearest) a._targetStone = nearest;
                    });
                }
                if (!attackersInOrbit && !nest.noAttackersSince) nest.noAttackersSince = now;
                if (nest.noAttackersSince && now - nest.noAttackersSince >= 2000) {
                    nest.isDefending = false;
                    nest.noAttackersSince = null;
                    nest.normalStateStartTime = now;
                    nest.lastWarAntFlush = now;
                    nest._nurseHomeRetreating = false; // hết tấn công → parade bắt đầu chu kỳ mới
                    nest._nurseHomePhase = 'idle';
                    nest._nurseHomePhaseStart = now;
                    const remainingWarIn = nest.warIn;
                    if (remainingWarIn > 30) {
                        const toPromote = remainingWarIn - 30;
                        promoteAnts(nest, "WarAnt", toPromote, 3* MAX_WAR_ANTS, 300, "lastWarAntFlush");
                    }
                }
            }
            if (!nest.isDefending && !nest.isAttacking && nest.normalStateStartTime && now - nest.normalStateStartTime >= 5000) {
                ants.filter(a => a.homeNest === nest && (a.type === "WarAnt" || a.type === "BomAnt")).forEach(a => a.toRemove = true);
                nest.normalStateStartTime = null;
            }
            const hasNearbyEnemyNest = nests.some(n => n !== nest && !n.isDeleting && Math.hypot(n.x - nest.x, n.y - nest.y) < nest.defenseRadius);
            if (hasNearbyEnemyNest && !nest.isAttacking && !nest.isDefending && !nest.isDeleting && !nest.isStarving) {
                const nearestEnemyNest = nests.filter(n => n !== nest && !n.isDeleting && Math.hypot(n.x - nest.x, n.y - nest.y) < nest.defenseRadius)
                    .reduce((closest, n) => {
                        if (!closest) return n;
                        const distN = Math.hypot(n.x - nest.x, n.y - nest.y);
                        const distC = Math.hypot(closest.x - nest.x, closest.y - nest.y);
                        return distN < distC ? n : closest;
                    }, null);
                nest.isAttacking = true; nest.attackTarget = nearestEnemyNest; nest.lastAttackActivation = now;
                if (nest.warIn > 20 && now >= nest.lastWarAntConversion) {
                    promoteAnts(nest, "WarAnt", randInt(1, 10), nest.isAttacking ? 100 : nest.maxWarAnts, 300, "lastWarAntConversion");
                }
            }
            const hasScoutWar = ants.some(a => a.type === "ScoutWar" && a.homeNest === nest &&
                a.targetNest && !a.targetNest.isDeleting && Math.hypot(a.x - nest.x, a.y - nest.y) < nest.defenseRadius);
            if (hasScoutWar && !nest.isAttacking && !nest.isDefending && !nest.isDeleting && !nest.isStarving) {
                const scoutWar = ants.find(a => a.type === "ScoutWar" && a.homeNest === nest &&
                    a.targetNest && !a.targetNest.isDeleting && Math.hypot(a.x - nest.x, a.y - nest.y) < nest.defenseRadius);
                nest.isAttacking = true; nest.attackTarget = scoutWar.targetNest; nest.lastAttackActivation = now;
                if (nest.warIn > 20 && now >= nest.lastWarAntConversion) {
                    promoteAnts(nest, "WarAnt", randInt(1, 10), nest.isAttacking ? 100 : nest.maxWarAnts, 300, "lastWarAntConversion");
                }
            }
            if (nest.isAttacking && nest.attackTarget) {
                if (nest.attackTarget.isDeleting || nest.food === 0) {
                    nest.isAttacking = false; nest.normalStateStartTime = now;
                    ants.filter(a => a.homeNest === nest && (a.type === "WarAnt" || a.type === "BomAnt")).forEach(a => { a.targetNest = null; a.targetAnt = null; });
                    nest.attackTarget = null; nest.lastWarAntFlush = now;
                    const remainingWarIn = nest.warIn;
                    if (remainingWarIn > 30) {
                        const toPromote = remainingWarIn - 30;
                        promoteAnts(nest, "WarAnt", toPromote, 3* MAX_WAR_ANTS, 300, "lastWarAntFlush");
                    }
                } else if (nest.warIn > 0) {
                    promoteAnts(nest, "WarAnt", randInt(1, 10), nest.isAttacking ? 100 : nest.maxWarAnts, 300, "lastWarAntConversion");
                }
            }
            const scoutWarReturning = ants.some(a =>
                a.type === "ScoutWar" &&
                a.homeNest === nest &&
                a.targetNest &&
                !a.targetNest.isDeleting &&
                Math.hypot(a.x - nest.x, a.y - nest.y) < 30
            );
            if (scoutWarReturning &&
                !nest.isAttacking &&
                !nest.isDefending &&
                !nest.isDeleting &&
                !nest.isStarving) {
                const reporter = ants.find(a => a.type === "ScoutWar" && a.homeNest === nest);
                if (reporter && reporter.targetNest) {
                    nest.isAttacking = true;
                    nest.attackTarget = reporter.targetNest;
                    nest.lastAttackActivation = now;
                    reporter.type = "scout";
                    reporter.color = nest.color;
                    reporter.targetNest = null;
                    if (nest.warIn >= 0) {
                        promoteAnts(nest, "WarAnt", randInt(1, 10), nest.isAttacking ? 100 : nest.maxWarAnts, 300, "lastWarAntConversion");
                    }
                }
            }
            } // end throttle 250ms
            if ((nest.isAttacking || nest.isDefending) && nest.warIn >= 8) {
                if (now - nest.lastBomAntPromotion >= 2000) {
                    if (nest.food >= 50 && nest.milk >= 150 && nest.wood >= 300) {
                        const promoteCount = 1;
                        if (nest.warIn >= promoteCount) {
                            promoteAnts(nest, "BomAnt", promoteCount, MAX_BOM_ANTS, 0, "lastBomAntPromotion");
                            nest.food -= 50;
                            nest.milk -= 150;
                            nest.wood -= 100;
                            nest.warIn -= promoteCount;
                            nest.lastBomAntPromotion = now;
                        }
                    }
                }
            }

            // ── Nest pheromone: spawn mỗi 3s quanh defenseRadius ──
            nests.forEach(nest => {
                if (now - nest.lastNestPheromone < 3000) return;
                nest.lastNestPheromone = now;
                // Giới hạn 40 nest pheromone/tổ — xóa cũ nhất nếu tràn
                const nestPhOfNest = pheromones.filter(p => p.type === 'nest' && p.homeNest === nest);
                if (nestPhOfNest.length > 32) {
                    const oldest = nestPhOfNest.sort((a, b) => a.creationTime - b.creationTime).slice(0, 8);
                    const oldestSet = new Set(oldest);
                    pheromones = pheromones.filter(p => !oldestSet.has(p));
                }
                const lifetime = Math.max(12000, 40000 / getEnvMultipliers().decayMult);
                const count = 8; // 8 điểm quanh vòng tròn
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const r = nest.defenseRadius * (0.7 + Math.random() * 0.3);
                    const dot = {
                        x: nest.x + Math.cos(angle) * r,
                        y: nest.y + Math.sin(angle) * r,
                        strength: 300, maxStrength: 300,
                        type: 'nest',
                        food: null, water: null,
                        homeNest: nest,
                        color: nest.color,
                        creationTime: now,
                        lifetime
                    };
                    if (pheromones.length < MAX_PHEROMONES) {
                        pheromones.push(dot);
                        addPheromoneToGrid(dot);
                    }
                }
            });

        }
        // — Hàm này chỉ chạy khi ant được thêm/xóa (_antCacheDirty = true) —
        function rebuildNestAntCache() {
            nestAntCache = new Map();
            nests.forEach(n => nestAntCache.set(n, { scouts:0, warAnts:0, bomAnts:0, warAndBom:0, queens:0, total:0 }));
            for (const a of ants) {
                const c = nestAntCache.get(a.homeNest);
                if (!c) continue;
                c.total++;
                if (a.type === 'scout' || a.type === 'ScoutWar') c.scouts++;
                else if (a.type === 'WarAnt')  { c.warAnts++;  c.warAndBom++; }
                else if (a.type === 'BomAnt')  { c.bomAnts++;  c.warAndBom++; }
                else if (a.type === 'QueenAnt') c.queens++;
            }
            _antCacheDirty = false;
        }

        // — Hàm này chạy mỗi frame vì vị trí ant thay đổi liên tục —
        function rebuildAntGrid() {
            antGrid = {};
            for (const a of ants) {
                const key = `${Math.floor(a.x/antGridSize)},${Math.floor(a.y/antGridSize)}`;
                if (!antGrid[key]) antGrid[key] = [];
                antGrid[key].push(a);
            }
        }

        // Wrapper giữ nguyên tên cũ — gọi cache chỉ khi dirty, grid luôn rebuild
        function rebuildAntCache() {
            if (_antCacheDirty) rebuildNestAntCache();
            rebuildAntGrid();
        }

        function getNearbyAnts(x, y, radius) {
            const gx = Math.floor(x/antGridSize), gy = Math.floor(y/antGridSize);
            const cells = Math.ceil(radius/antGridSize), result = [];
            for (let dx = -cells; dx <= cells; dx++)
                for (let dy = -cells; dy <= cells; dy++) {
                    const a = antGrid[`${gx+dx},${gy+dy}`];
                    if (a) result.push(...a);
                }
            return result;
        }

        // ══ Warp system ══
        // ══════════════════════════════════════════
        // ══  WARP & WARP WALL — hằng số cấu hình  ══
        // ══════════════════════════════════════════
        // — Warp portal —
        const WARP_RADIUS        = 20;       // bán kính vẽ cổng warp (px)
        const WARP_LIFETIME      = 60000;    // thời gian tồn tại cổng warp (ms)
        const WARP_COST_WOOD     = 500;      // gỗ tiêu thụ để xây 1 cổng warp
        const WARP_INTERVAL      = 5000;     // cooldown xây cổng warp mới (ms)
        const WARP_MAX_PER_NEST  = 5;        // số cổng warp tối đa mỗi tổ
        const WARP_SECTOR_COUNT  = 6;        // 360° chia 6 sector, mỗi warp 1 sector
        

        function updateWarps(now) {
            // Xóa warp hết hạn
            warps = warps.filter(w => now - w.creationTime < WARP_LIFETIME && !w.homeNest.toRemove);
            // Tạo warp mới mỗi WARP_INTERVAL nếu đủ wood
            nests.forEach(nest => {
                if (nest.toRemove || nest.isDeleting) return;
                const nestWarps = warps.filter(w => w.homeNest === nest);
                if (nestWarps.length >= WARP_MAX_PER_NEST) return;
                if (!nest._lastWarpTime) nest._lastWarpTime = now - WARP_INTERVAL;
                if (now - nest._lastWarpTime < WARP_INTERVAL) return;
                if ((nest.wood || 0) < WARP_COST_WOOD) return;

                // Tính sector nào đã có warp
                const sectorSize = (Math.PI * 2) / WARP_SECTOR_COUNT; // 60°
                const usedSectors = new Set(nestWarps.map(w => {
                    const angle = Math.atan2(w.y - nest.y, w.x - nest.x);
                    return Math.floor(((angle + Math.PI * 2) % (Math.PI * 2)) / sectorSize);
                }));

                // Tìm sector trống
                const freeSectors = [];
                for (let s = 0; s < WARP_SECTOR_COUNT; s++) {
                    if (!usedSectors.has(s)) freeSectors.push(s);
                }
                if (freeSectors.length === 0) return;

                // Chọn sector ngẫu nhiên trong các sector trống
                const sector = freeSectors[Math.floor(Math.random() * freeSectors.length)];
                // Góc random trong sector đó
                const baseAngle = sector * sectorSize;
                const angle = baseAngle + Math.random() * sectorSize;
                const r = nest.defenseRadius;
                const wx = Math.max(WARP_RADIUS, Math.min(WORLD_WIDTH  - WARP_RADIUS, nest.x + Math.cos(angle) * r));
                const wy = Math.max(WARP_RADIUS, Math.min(WORLD_HEIGHT - WARP_RADIUS, nest.y + Math.sin(angle) * r));

                const isFlooded = waters.some(w => isPointInWater(wx, wy, w) && w.amount > 100);
                const isBlocked = obstacles.some(o => Math.hypot(wx - o.x, wy - o.y) < o.radius + WARP_RADIUS);
                if (isFlooded || isBlocked) return;

                nest.wood -= WARP_COST_WOOD;
                warps.push({ x: wx, y: wy, homeNest: nest, creationTime: now, sector });
                nest._lastWarpTime = now;
            });
            nests.forEach(nest => { if (!nest.toRemove && !nest.isDeleting) return; });
        }

        function getScoutWarpOut(scout) {
            // Scout rảnh chọn warp để ra ngoài
            const nestWarps = warps.filter(w => {
                if (w.homeNest !== scout.homeNest) return false;
                const isFlooded = waters.some(wa => isPointInWater(w.x, w.y, wa) && wa.amount > 100);
                const isBlocked = obstacles.some(o => Math.hypot(w.x - o.x, w.y - o.y) < o.radius + WARP_RADIUS);
                return !isFlooded && !isBlocked;
            });
            if (nestWarps.length === 0) return null;
            return nestWarps[Math.floor(Math.random() * nestWarps.length)];
        }

        function getShortestReturnWarp(scout) {
            // Scout mang đồ chọn warp gần nhất về tổ
            const nestWarps = warps.filter(w => w.homeNest === scout.homeNest);
            if (nestWarps.length === 0) return null;
            let best = null, bestDist = Math.hypot(scout.x - scout.homeNest.x, scout.y - scout.homeNest.y);
            nestWarps.forEach(w => {
                const d = Math.hypot(scout.x - w.x, scout.y - w.y);
                if (d < bestDist) { best = w; bestDist = d; }
            });
            return best;
        }

        function updateAnts() {
            const now = Date.now();
            rebuildAntCache();
            nests.forEach(nest => updateNestStates(nest, now));

            // ── DefenseRadius + NurseHome patrol: cập nhật mỗi 5s ──
            if (now - timers.lastDefenseUpdate >= 1000) {
                nests.forEach(nest => {
                    const nurseHomeRatio = nest.nurseHome / MAX_NURSE_EACH;
                    const baseRadius     = centerRadius + 15 + (nest.wood || 0) / 200 + (nest.food || 0) / 1000;
                    const homeBonus      = (baseRadius - (centerRadius + 15)) * nurseHomeRatio;
                    nest.defenseRadius   = baseRadius + homeBonus;
                });
                timers.lastDefenseUpdate = now;
            }

            if (now - (timers.lastNurseHomePatrol || 0) >= 100) {
                nests.forEach(nest => {
                    if (nest.isDeleting || nest.nurseHome <= 0) {
                        nest._nurseHomePhase = 'idle';
                        return;
                    }
                    // Khi bị tấn công / ngập: rút vào ngay, reset về idle sau
                    if (nest.isDefending || nest.isFlooding) {
                        nest._nurseHomeRetreating = true;
                        nest._nurseHomePhase = 'idle';
                        return;
                    }
                    nest._nurseHomeRetreating = false;

                    // Phát hiện defenseRadius thay đổi → restart phase 'out'
                    if (nest._nurseHomeLastR !== null && Math.abs(nest.defenseRadius - nest._nurseHomeLastR) > 2) {
                        nest._nurseHomePhase = 'out';
                        nest._nurseHomePhaseStart = now;
                    }
                    nest._nurseHomeLastR = nest.defenseRadius;

                    const phaseAge = now - (nest._nurseHomePhaseStart || 0);

                    if (nest._nurseHomePhase === 'idle') {
                        // idle: chờ 500–800ms rồi bắt đầu chu kỳ mới
                        const idleWait = nest._nurseHomeIdleWait || 600;
                        if (phaseAge >= idleWait) {
                            nest._nurseHomePhase = 'out';
                            nest._nurseHomePhaseStart = now;
                            nest._nurseHomeIdleWait = 500 + Math.random() * 300;
                            const patrolCost = Math.floor(nest.nurseHome * 2);
                            nest.wood = Math.max(0, nest.wood - patrolCost);
                        }
                    } else if (nest._nurseHomePhase === 'out') {
                        // phase 1: chạy ra — kết thúc khi _nurseHomeR đủ gần defenseRadius
                        const rCurrent = nest._nurseHomeR || centerRadius;
                        if (rCurrent >= nest.defenseRadius - 2) {
                            nest._nurseHomePhase = 'patrol';
                            nest._nurseHomePhaseStart = now;
                        }
                    } else if (nest._nurseHomePhase === 'patrol') {
                        // phase 2: chạy vòng 2s
                        if (phaseAge >= 2000) {
                            nest._nurseHomePhase = 'in';
                            nest._nurseHomePhaseStart = now;
                        }
                    } else if (nest._nurseHomePhase === 'in') {
                        // phase 3: thu về — kết thúc khi _nurseHomeR đủ gần centerRadius
                        const rCurrent = nest._nurseHomeR || nest.defenseRadius;
                        if (rCurrent <= centerRadius * 1.25) {
                            nest._nurseHomePhase = 'idle';
                            nest._nurseHomePhaseStart = now;
                        }
                    }
                });
                timers.lastNurseHomePatrol = now;
            }

            // ── Wood tiêu thụ để duy trì defenseRadius: mỗi 1s ──
            if (now - timers.lastDefenseWoodCost >= 800) {
                nests.forEach(nest => {
                    const minDefenseRadius = centerRadius + 15;
                    const excess   = Math.max(0, nest.defenseRadius - minDefenseRadius);
                    const woodCost = Math.floor((excess * excess) / 20);
                    if (nest.wood >= woodCost) {
                        nest.wood = Math.max(0, nest.wood - woodCost);
                    } else {
                        nest.wood = 0;
                        nest.defenseRadius = Math.max(minDefenseRadius, nest.defenseRadius - 5);
                    }
                });
                timers.lastDefenseWoodCost = now;
            }
            nests.forEach(nest => {
                const hatchInterval = (nest.nurseLarvae < 15 || nest.isStarving) ? 2000 : 1000;
                if (now - nest.lastLarvaeHatch >= hatchInterval) {
                    hatchLarvae(nest, now);
                    nest.lastLarvaeHatch = now;
                }
            });
            ants.forEach(ant => ant.update());

            // ── Sinh bụi khi mất HP ──
            ants.forEach(ant => {
                const prevHp = ant._prevHp ?? ant.hp;
                if (ant.hp < prevHp) spawnDust(ant.x, ant.y, now);
                ant._prevHp = ant.hp;
            });
            if (now - timers.lastQueenHPEffect > 3000) {
                nests.forEach(nest => handleEggProduction(nest, now));
                timers.lastQueenHPEffect = now;
            }
            if (now - timers.lastQueenHeal > 1000) {
                nests.forEach(nest => handleQueenHeal(nest));
                timers.lastQueenHeal = now;
            }
            nests.forEach(nest => {
                const hatchInterval = nest.nurseRoyal === 0 ? 2000 : ((nest.nurseRoyal < 15 || nest.isStarving) ? 500 : 1000);
                if (now - nest.lastEggHatch >= hatchInterval) {
                    const milkMultiplier = nest.nurseRoyal === 0 ? 3 : 1;
                    const maxHatch = nest.nurseRoyal === 0 ? 1 : Math.max(1, Math.floor(nest.nurseRoyal * 0.5));
                    const larvaeOverflow = nest.larvae >= MAX_ANTS_PER_NEST * LARVAE_HATCH_SLOW_RATIO;
                    const hatchCap = larvaeOverflow ? 10 : maxHatch;
                    const hatchCount = Math.min(Math.floor(nest.eggs), Math.floor(nest.milk / (milkMultiplier * 2)), hatchCap);
                    nest.larvae = Math.max(0, nest.larvae + hatchCount);
                    nest.eggs   = Math.max(0, nest.eggs   - hatchCount);
                    nest.milk   = Math.max(0, nest.milk   - hatchCount * milkMultiplier * 2);
                    nest.lastEggHatch = now;
                }
            });
            if (now - timers.lastHomeAntConsumption > 1000) {
                nests.forEach(nest => {
                    const scoutInCount = nest.scoutIn;
                    const NurseCount = totalNurse(nest);
                    const warInCount = nest.warIn;
                    const larvaeCount = nest.larvae;

                    // ── Nurse sản xuất milk từ food + water ──
                    let milkProduced = 0;
                    if (nest.nurseProduction > 0 && nest.food > 0) {
                        const activeNurse  = Math.min(nest.nurseProduction, Math.floor(nest.food / 3));
                        const boostedNurse = Math.min(activeNurse, Math.floor(nest.water));
                        const normalNurse  = activeNurse - boostedNurse;
                        milkProduced = boostedNurse * 8 + normalNurse * 4;
                        nest.food  = Math.max(0, nest.food  - activeNurse * 3);
                        nest.water = Math.max(0, nest.water - boostedNurse);
                        nest.milk  = nest.milk + milkProduced;
                    }

                    // ── Tiêu thụ food (queen) ──
                    const foodNeeded = nest.queen * nest.queenConsumption;
                    if (nest.food >= foodNeeded) {
                        nest.food    = Math.max(0, nest.food - foodNeeded);
                        nest.queenHP = Math.min(MaxHP, nest.queenHP + nest.queenConsumption);
                    } else {
                        const foodShortfall = foodNeeded - nest.food;
                        nest.food    = 0;
                        nest.queenHP = Math.max(0, nest.queenHP - foodShortfall * 2);
                    }

                    // ── Tiêu thụ milk ──
                    const scoutOutCount = (nestAntCache.get(nest)?.scouts) || 0;
                    const warOutCount   = (nestAntCache.get(nest)?.warAndBom) || 0;
                    // Larvae: 1 milk/larvae/1s | warIn: 2 milk/warIn | scout/war ngoài: 1
                    const milkForLarvae = larvaeCount * 1;
                    const milkConsumed  = milkForLarvae + 2 * warInCount + scoutOutCount + warOutCount;
                    if (nest.milk < milkForLarvae) {
                        const shortfall = milkForLarvae - nest.milk;
                        const larvaeToDie = Math.floor(shortfall / 1);
                        nest.larvae = Math.max(0, nest.larvae - larvaeToDie);
                        nest.milk   = 0;
                    } else if (nest.milk < milkConsumed) {
                        const milkShortfall    = milkConsumed - nest.milk;
                        const warMilkShortfall = Math.floor(milkShortfall / 2);
                        if (!nest.isAttacking && !nest.isDefending && warMilkShortfall > 0 && nest.warIn > 0) {
                            const _warOutNow  = (nestAntCache.get(nest)?.warAndBom) || 0;
                            const _warOutSlot = Math.max(0, 20 - _warOutNow);
                            if (_warOutSlot > 0) {
                                const pushOut = Math.min(_warOutSlot, nest.warIn, warMilkShortfall);
                                promoteAnts(nest, "WarAnt", pushOut, Infinity, 0, "lastWarAntConversion");
                                if (!nest.normalStateStartTime) nest.normalStateStartTime = now;
                            } else {
                                nest.warIn = Math.max(0, nest.warIn - Math.min(warMilkShortfall, nest.warIn));
                            }
                        }
                        nest.milk = Math.max(0, nest.milk - milkForLarvae);
                    } else {
                        nest.milk = Math.max(0, nest.milk - milkConsumed);
                    }
                });
                timers.lastHomeAntConsumption = now;
                nests = nests.filter(n => !n.toRemove);
            if (selectedNest && selectedNest.toRemove) { selectedNest = null; updateNestInfoPanel(); }
                ants = ants.filter(a => a.homeNest && !a.homeNest.toRemove);
                _antCacheDirty = true;
                // Kiến chết để lại xác → food nhỏ
                ants.filter(a => a.toRemove && a.hp <= 0 && !a._corpseDropped).forEach(a => {
                    a._corpseDropped = true;
                    if (a.type === 'WarAnt' || a.type === 'BomAnt') {
                        corpses.push({ x: a.x, y: a.y, amount: 8, decay: 0, color: a.homeNest?.color || '#888' });
                    } else if (a.type === 'scout') {
                        corpses.push({ x: a.x, y: a.y, amount: 3, decay: 0, color: a.homeNest?.color || '#888' });
                    }
                });
                ants = ants.filter(a => !a.toRemove);
                _antCacheDirty = true;
            }
            // Cập nhật xác phân hủy → food
            corpses = corpses.filter(c => {
                c.decay += 0.0005 * gameSpeed;
                return c.decay < 1; // xác mờ dần rồi biến mất, không thành food
            });
            if (now - timers.lastFoodGrowth > 2000) {
                const props = getSeasonProperties(currentSeason);
                foods.forEach(food => {
                    if (!food.isSpecial) food.amount = Math.min(food.amount + 200 * props.growthMultiplier, props.maxAmount);
                });
                timers.lastFoodGrowth = now;
            }
            updateWatersGrowth(now);
            if (now - timers.lastFoodSpawn > 2000) {
                const props = getSeasonProperties(currentSeason);
                if (props.spawnAllowed) {
                    const newFoods = [];
                    foods.forEach(food => {
                        if (!food.isSpecial && foods.length + newFoods.length < 150) {
                            const angle = Math.random() * Math.PI * 2;
                            const distance = randInt(20, 50);
                            const amount = 3;
                            const nearFood = {
                                x: Math.max(100, Math.min(WORLD_WIDTH - 100, food.x + Math.cos(angle) * distance)),
                                y: Math.max(100, Math.min(WORLD_HEIGHT - 100, food.y + Math.sin(angle) * distance)),
                                amount: amount / 2,
                                wood: amount / 2,
                                isSpecial: false
                            };
                            newFoods.push(nearFood);
                            addToGrid(nearFood, nearFood.x, nearFood.y);
                        }
                        if (!food.isSpecial && foods.length + newFoods.length < 150) {
                            const amount = 300;
                            const randomFood = { x: randInt(100, WORLD_WIDTH - 100), y: randInt(100, WORLD_HEIGHT - 100), amount: amount / 2, wood: amount / 2, isSpecial: false };
                            newFoods.push(randomFood); addToGrid(randomFood, randomFood.x, randomFood.y);
                        }
                    });
                    foods.push(...newFoods);
                }
                timers.lastFoodSpawn = now;
            }
            // Water spawn bị tắt - điểm nước cố định được quản lý trong updateWatersGrowth
            timers.lastWaterSpawn = now;
            ants = ants.filter(a => !a.toRemove);
            _antCacheDirty = true;
            nests.forEach(nest => {
                const scoutCount = (nestAntCache.get(nest)?.scouts) || 0;
                if (nest.scoutIn > 0 && now - nest.lastScoutBurst > nest.config.scoutBurstInterval && scoutCount < 40) {
                    const maxScouts = (nest.isStarving || nest.isDeleting) ? 1.5 * MAX_SCOUTS : MAX_SCOUTS;
                    const promoteCount = Math.min(nest.scoutIn, maxScouts - scoutCount);
                    promoteAnts(nest, "scout", promoteCount, maxScouts, 0, "lastScoutBurst");
                }
            });
            nests.forEach(nest => {
                const queenAntCount = (nestAntCache.get(nest)?.queens) || 0;
                const queenSpawnCooldown = 30000;
                if (now - nest.lastQueenAntSpawn > queenSpawnCooldown && queenAntCount < MAX_QUEEN_ANTS && nests.length < MAX_NESTS_TOTAL
                    && !nest.isStarving && !nest.isDefending && !nest.isDeleting) {
                    const scoutCount = (nestAntCache.get(nest)?.scouts) || 0;
                    if (scoutCount > 1 && queenAntCount + 1 <= 3) {
                        const newQueen = new QueenAnt(nest.x, nest.y, nest);
                        ants.push(newQueen); nest.ants.push(newQueen);
                        _antCacheDirty = true;
                        nest.maxEggs = randInt(MAX_EGGS_QUEEN_SPAWN.min, MAX_EGGS_QUEEN_SPAWN.max);
                        nest.lastQueenAntSpawn = now;
                    }
                }
            });
            nests = nests.filter(n => !n.toRemove);
            foods = foods.filter(food => food.amount > 0 || food.wood > 0 || food.isSpecial);
            // Rebuild foodGrid để loại bỏ food đã cạn kiệt
            foodGrid = {};
            foods.forEach(f => addToGrid(f, f.x, f.y));
            updateWarps(now);
            pheromones.forEach(p => {
                const elapsed = now - p.creationTime;
                const life = p.lifetime || 20000;
                p.strength = p.maxStrength * Math.max(0, 1 - elapsed / life);
            });
            pheromones = pheromones.filter(p => {
                if (p.strength <= 2) return false;
                if (now - p.creationTime >= (p.lifetime || 20000)) return false;
                // Nest pheromone: tồn tại theo lifetime
                if (p.type === 'nest') return true;
                // Marker tại target: tồn tại theo lifetime, không xóa khi food/water cạn
                if (p.isMarker) return true;
                // Trail pheromone: xóa khi target hết
                const foodOk = p.food && (p.food.amount > 0 || p.food.wood > 0 || p.food.isSpecial);
                const waterOk = p.water && p.water.amount > 0;
                if (!foodOk && !waterOk) return false;
                return true;
            });
            // Rebuild pheromone grid chỉ khi cần (sau khi filter)
            const _phKeys = Object.keys(pheromoneGrid);
            for (const k of _phKeys) pheromoneGrid[k].length = 0;
            pheromones.forEach(p => addPheromoneToGrid(p));
            if (now - timers.lastMushroomUpdate > 4000) {
                const MAX_MUSHROOM = 5000;
                nests.forEach(nest => {
                    const mushroomRatio = nest.nurseMushroom / MAX_NURSE_EACH; // 0.0 → 1.0
                    if (nest.mushroom < MAX_MUSHROOM && nest.food > nest.mushroom && nest.water > nest.mushroom) {
                        nest.food -= nest.mushroom;
                        nest.water -= nest.mushroom / 2;
                        const growAmount = 200 * (mushroomRatio * NURSE_MUSH_RATIO + (1 - NURSE_MUSH_RATIO));
                        nest.mushroom = Math.min(MAX_MUSHROOM, nest.mushroom + growAmount);
                    } else {
                        // Thu hoạch giảm còn mushroomRatio × 80% khi thiếu nurse
                        const harvestMult = mushroomRatio * 0.8 + 0.2; // min 20%, max 100%
                        nest.mushroom = Math.max(0, nest.mushroom - 100 * harvestMult);
                    }
                });
                timers.lastMushroomUpdate = now;
            }
            if (now - timers.lastMushroomProduce > 1000) {
                nests.forEach(nest => {
                    nest.food += 0.2 * nest.mushroom;
                    nest.wood += 0.1 * nest.mushroom;
                    nest.milk += nest.mushroom;
                });
                timers.lastMushroomProduce = now;
            }
            // Explosion chỉ được vẽ MỘT LẦN trong draw()
            explosions = explosions.filter(e => Date.now() - e.creationTime <= 1200);
            dusts = dusts.filter(d => now - d.creationTime < 2000);

            // ── Stone bị phá → xóa khỏi obstacles ──
            obstacles = obstacles.filter(o => !(o.type === 'stone' && o.hp <= 0));

        function drawNestStatusCircle(nest) {
            ctx.strokeStyle = `hsla(${nest.color.match(/\d+/)[0]}, 100%, 50%, 0.15)`;

            const _phaseCenter = (Date.now() / 400) % (Math.PI * 2);
            const _pulse = 0.15 + 0.08 * Math.sin(_phaseCenter);
            const _nestHue = (nest.color.match(/\d+/) || [120])[0];
            ctx.strokeStyle = `hsla(${_nestHue}, 90%, 60%, ${_pulse + 0.1})`;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 6]);
            ctx.lineDashOffset = -Date.now() / 80;
            ctx.beginPath(); ctx.arc(nest.x, nest.y, centerRadius, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);

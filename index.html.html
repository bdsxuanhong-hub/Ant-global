        // ── NurseHome parade: 3 phase — out / patrol / in / idle ──
        // Pure animation — không tạo ant object, chỉ tính vị trí lúc draw
        function drawNurseHomeParade(nest) {
            const count = nest.nurseHome;
            if (count <= 0 || nest.isDeleting) return;
            // Khi rút khẩn cấp (bị tấn công/ngập): ẩn, reset về centerRadius
            if (nest._nurseHomeRetreating) {
                nest._nurseHomeR = centerRadius;
                return;
            }

            const phase = nest._nurseHomePhase || 'idle';
            if (phase === 'idle') {
                nest._nurseHomeR = centerRadius;
                return;
            }

            const now  = Date.now();
            const hue  = (nest.color.match(/\d+/) || [120])[0];
            const defR = nest.defenseRadius;

            // Khởi bán kính nếu chưa có
            if (!nest._nurseHomeR || nest._nurseHomeR < centerRadius) nest._nurseHomeR = centerRadius;

            // Easing bán kính theo phase — 0.10/frame ≈ đạt đích trong ~1s tại 60fps
            if (phase === 'out' || phase === 'patrol') {
                nest._nurseHomeR += (defR - nest._nurseHomeR) * 0.10;
            } else if (phase === 'in') {
                nest._nurseHomeR += (centerRadius - nest._nurseHomeR) * 0.10;
            }
            const r = nest._nurseHomeR;

            // Không vẽ khi chưa ra khỏi tổ đáng kể
            if (r < centerRadius + 2) return;

            // Tốc độ quay: patrol đầy đủ, out/in chậm 30%
            const baseSpeed = (count / MAX_NURSE_EACH) * (Math.PI * 2) / 8000;
            const speed     = phase === 'patrol' ? baseSpeed : baseSpeed * 0.3;
            const baseAngle = (now * speed) % (Math.PI * 2);

            // Số chấm — fade theo tỉ lệ r/defR
            const maxVisible = Math.min(20, Math.max(2, Math.floor(count / 5)));
            const rRatio     = Math.max(0, Math.min(1, (r - centerRadius) / (defR - centerRadius + 1)));
            const visible    = Math.max(1, Math.round(maxVisible * rRatio));
            const spread     = (Math.PI * 2 / 3) / Math.max(1, visible);
            const isPatrol   = phase === 'patrol';
            const size       = isPatrol ? 4 : 3;
            const baseAlpha  = isPatrol ? 0.85 : 0.45 + rRatio * 0.4;

            for (let i = 0; i < visible; i++) {
                const angle = baseAngle + i * spread;
                const px = nest.x + Math.cos(angle) * r;
                const py = nest.y + Math.sin(angle) * r;
                if (!isInView(px, py)) continue;

                const fadeFrac = i / (visible - 1 || 1);
                const alpha    = baseAlpha * (0.5 + 0.5 * Math.sin(fadeFrac * Math.PI));

                ctx.save();
                ctx.translate(px, py);

                // Trail nhỏ phía sau — chỉ trong patrol
                if (isPatrol) {
                    const trailAngle = angle - speed * 150;
                    const tx = Math.cos(trailAngle) * r - Math.cos(angle) * r;
                    const ty = Math.sin(trailAngle) * r - Math.sin(angle) * r;
                    ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${alpha * 0.25})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(tx - 1, ty); ctx.lineTo(tx + 1, ty);
                    ctx.moveTo(tx, ty - 1); ctx.lineTo(tx, ty + 1);
                    ctx.stroke();
                }

                // Viền nâu
                ctx.strokeStyle = `rgba(101, 67, 33, ${alpha})`;
                ctx.lineWidth = isPatrol ? 2.5 : 1.8;
                ctx.beginPath();
                ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
                ctx.moveTo(0, -size); ctx.lineTo(0, size);
                ctx.stroke();

                // Lõi màu tổ
                ctx.strokeStyle = `hsla(${hue}, 90%, ${isPatrol ? 65 : 45}%, ${alpha})`;
                ctx.lineWidth = isPatrol ? 1.5 : 1;
                ctx.beginPath();
                ctx.moveTo(-(size-1), 0); ctx.lineTo(size-1, 0);
                ctx.moveTo(0, -(size-1)); ctx.lineTo(0, size-1);
                ctx.stroke();

                ctx.restore();
            }
        }

        // ── Vẽ overlay đêm (độc lập với thời tiết) ──
        function drawSkyBackground(ctx) {
            const now = Date.now();
            const W = DISPLAY_WIDTH;
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // ── Màu nền trời theo ngày/đêm/phase ──
            let skyTop, skyBottom;
            if (isNight) {
                const np = getNightProgress(now);
                // Đầu đêm và cuối đêm (chuyển tiếp): tím đậm → đen đêm
                const edgeFade = Math.min(np, 1 - np) * 2; // 0→1 khi giữa đêm
                const r = Math.round(8  + edgeFade * 2);
                const g = Math.round(8  + edgeFade * 4);
                const b = Math.round(28 + edgeFade * 12);
                skyTop    = `rgb(${r},${g},${b})`;
                skyBottom = `rgb(${Math.round(r*1.3)},${Math.round(g*1.3)},${Math.round(b*1.5)})`;
            } else {
                const p = getDayProgress(now);
                if (p < 0.10) {
                    // Bình minh: đen → tím hồng → cam
                    const t = p / 0.10;
                    skyTop    = `rgb(${Math.round(20+60*t)},${Math.round(10+30*t)},${Math.round(40+20*t)})`;
                    skyBottom = `rgb(${Math.round(180+40*t)},${Math.round(80+60*t)},${Math.round(40+20*t)})`;
                } else if (p < 0.25) {
                    // Sáng sớm: hồng → xanh nhạt
                    const t = (p - 0.10) / 0.15;
                    skyTop    = `rgb(${Math.round(80-40*t)},${Math.round(40+90*t)},${Math.round(60+100*t)})`;
                    skyBottom = `rgb(${Math.round(220-50*t)},${Math.round(140+40*t)},${Math.round(60+80*t)})`;
                } else if (p < 0.75) {
                    // Ngày: xanh lam trong
                    const t = (p - 0.25) / 0.50;
                    const intensity = 1 - Math.abs(t - 0.5) * 0.3; // đậm nhất lúc trưa
                    skyTop    = `rgb(${Math.round(40+20*(1-intensity))},${Math.round(130+30*intensity)},${Math.round(200+30*intensity)})`;
                    skyBottom = `rgb(${Math.round(100+40*intensity)},${Math.round(170+30*intensity)},${Math.round(220+20*intensity)})`;
                } else if (p < 0.90) {
                    // Chiều: xanh → vàng cam
                    const t = (p - 0.75) / 0.15;
                    skyTop    = `rgb(${Math.round(60+100*t)},${Math.round(160-40*t)},${Math.round(230-120*t)})`;
                    skyBottom = `rgb(${Math.round(140+80*t)},${Math.round(200-50*t)},${Math.round(240-120*t)})`;
                } else {
                    // Hoàng hôn: cam đỏ → tím tối
                    const t = (p - 0.90) / 0.10;
                    skyTop    = `rgb(${Math.round(160-80*t)},${Math.round(120-80*t)},${Math.round(110-60*t)})`;
                    skyBottom = `rgb(${Math.round(220-80*t)},${Math.round(150-100*t)},${Math.round(80-40*t)})`;
                }
            }

            // Gradient dọc
            const grad = ctx.createLinearGradient(0, 0, 0, SKY_HEIGHT);
            grad.addColorStop(0, skyTop);
            grad.addColorStop(1, skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, SKY_HEIGHT);

            // ── Overlay thời tiết lên trời ──
            if (currentWeather === 'rain') {
                // Trời mưa: overlay xám đục
                const rainGrad = ctx.createLinearGradient(0, 0, 0, SKY_HEIGHT);
                rainGrad.addColorStop(0, 'rgba(80,90,100,0.55)');
                rainGrad.addColorStop(1, 'rgba(60,70,80,0.30)');
                ctx.fillStyle = rainGrad;
                ctx.fillRect(0, 0, W, SKY_HEIGHT);
            } else if (currentWeather === 'wind') {
                // Trời gió: hơi xám nhẹ
                ctx.fillStyle = 'rgba(180,190,200,0.12)';
                ctx.fillRect(0, 0, W, SKY_HEIGHT);
            }

            // ── Đường chân trời mờ (blend sky → ground) ──
            const horizonGrad = ctx.createLinearGradient(0, SKY_HEIGHT - 20, 0, SKY_HEIGHT);
            horizonGrad.addColorStop(0, 'rgba(0,0,0,0)');
            horizonGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
            ctx.fillStyle = horizonGrad;
            ctx.fillRect(0, SKY_HEIGHT - 20, W, 20);

            ctx.restore();
        }

        function getSkySkyBottomColor() {
            // Trả về màu skyBottom tương ứng phase hiện tại (dùng cho ánh sáng mặt đất)
            if (isNight) return { r:20, g:22, b:50 };
            const p = getDayProgress(Date.now());
            if      (p < 0.10) return { r: Math.round(180+40*(p/0.10)), g: Math.round(80+60*(p/0.10)), b: 60 };  // bình minh: cam đỏ
            else if (p < 0.25) { const t=(p-0.10)/0.15; return { r:Math.round(220-50*t), g:Math.round(140+40*t), b:Math.round(60+80*t) }; }
            else if (p < 0.75) { const t=(p-0.25)/0.50, i=1-Math.abs(t-0.5)*0.3; return { r:Math.round(100+40*i), g:Math.round(170+30*i), b:Math.round(220+20*i) }; }
            else if (p < 0.90) { const t=(p-0.75)/0.15; return { r:Math.round(140+80*t), g:Math.round(200-50*t), b:Math.round(240-120*t) }; }
            else               { const t=(p-0.90)/0.10; return { r:Math.round(220-80*t), g:Math.round(150-100*t), b:Math.round(80-40*t) }; }
        }

        function drawGroundLayers(ctx) {
            const now  = Date.now();
            const W    = DISPLAY_WIDTH;
            const H    = DISPLAY_HEIGHT;
            const s    = currentSeason;
            const GH   = GROUND_HEIGHT;
            const y0   = H - GH;

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Ánh sáng bầu trời phản chiếu lên mặt đất
            const skyC = getSkySkyBottomColor();
            const ambientAlpha = isNight ? 0.35 : 0.18;

            // ── Tầng 1: Mặt đất (trên cùng, 12px) ──
            const surfaceColors = [
                ['#5a8a3a','#4a7a2a'],  // Xuân: xanh tươi
                ['#3d7a22','#2d6a12'],  // Hạ: xanh đậm
                ['#8a6a2a','#7a5a1a'],  // Thu: nâu vàng
                ['#c8d4d8','#b0bfc5'],  // Đông: tuyết trắng xám
            ];
            const [sc1, sc2] = surfaceColors[s];
            const surfGrad = ctx.createLinearGradient(0, y0, 0, y0 + 12);
            surfGrad.addColorStop(0, sc1);
            surfGrad.addColorStop(1, sc2);
            ctx.fillStyle = surfGrad;
            ctx.fillRect(0, y0, W, 12);

            // Chi tiết mặt đất theo mùa
            if (s === 0) {
                // Xuân: chồi non xanh nhô lên
                for (let i = 0; i < 30; i++) {
                    const gx = ((i * 2311) % 1000) / 1000 * W;
                    const gh = 4 + ((i * 1731) % 6);
                    ctx.fillStyle = `rgba(120,200,60,0.7)`;
                    ctx.fillRect(gx, y0 - gh, 2, gh);
                }
            } else if (s === 1) {
                // Hạ: cỏ cao, um tùm
                for (let i = 0; i < 40; i++) {
                    const gx = ((i * 1877) % 1000) / 1000 * W;
                    const gh = 6 + ((i * 2131) % 8);
                    ctx.strokeStyle = `rgba(60,160,30,0.6)`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(gx, y0);
                    ctx.quadraticCurveTo(gx + 3, y0 - gh * 0.6, gx + ((i%2)*2-1) * 3, y0 - gh);
                    ctx.stroke();
                }
            } else if (s === 2) {
                // Thu: lá vàng rụng trên mặt đất
                for (let i = 0; i < 25; i++) {
                    const lx = ((i * 3111) % 1000) / 1000 * W;
                    const ly = y0 + 2 + ((i * 1237) % 7);
                    ctx.fillStyle = i % 3 === 0 ? 'rgba(200,100,20,0.7)' : 'rgba(180,140,20,0.65)';
                    ctx.beginPath();
                    ctx.ellipse(lx, ly, 4, 2.5, (i * 0.8) % Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                // Đông: tuyết + nhũ băng
                ctx.fillStyle = 'rgba(240,248,255,0.8)';
                ctx.fillRect(0, y0, W, 4);
                for (let i = 0; i < 20; i++) {
                    const ix = ((i * 2713) % 1000) / 1000 * W;
                    const ih = 4 + ((i * 1511) % 8);
                    ctx.fillStyle = 'rgba(200,230,255,0.7)';
                    ctx.beginPath();
                    ctx.moveTo(ix - 2, y0 + 2);
                    ctx.lineTo(ix + 2, y0 + 2);
                    ctx.lineTo(ix, y0 + 2 + ih);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Mưa → vũng nước trên mặt đất
            if (currentWeather === 'rain') {
                for (let i = 0; i < 6; i++) {
                    const px = ((i * 3717) % 1000) / 1000 * W;
                    const ripple = 0.5 + 0.5 * Math.sin(now * 0.006 + i * 1.3);
                    ctx.fillStyle = `rgba(120,160,200,0.45)`;
                    ctx.beginPath();
                    ctx.ellipse(px, y0 + 6, 18 + ripple * 4, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Gợn sóng
                    ctx.strokeStyle = `rgba(160,200,240,${0.3 + ripple * 0.2})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(px, y0 + 6, 22 + ripple * 6, 5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ── Tầng 2: Giữa (đất nâu, rễ, 11px) ──
            const midGrad = ctx.createLinearGradient(0, y0 + 12, 0, y0 + 23);
            midGrad.addColorStop(0, s === 3 ? '#6a7a80' : '#7a5230');
            midGrad.addColorStop(1, s === 3 ? '#4a5a60' : '#5a3820');
            ctx.fillStyle = midGrad;
            ctx.fillRect(0, y0 + 12, W, 11);
            // Rễ cây
            ctx.strokeStyle = s === 3 ? 'rgba(80,60,40,0.5)' : 'rgba(60,30,10,0.55)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 12; i++) {
                const rx = ((i * 4131) % 1000) / 1000 * W;
                ctx.beginPath();
                ctx.moveTo(rx, y0 + 12);
                ctx.bezierCurveTo(rx - 6, y0 + 16, rx + 8, y0 + 18, rx + ((i%2)*12-6), y0 + 23);
                ctx.stroke();
            }
            // Đá nhỏ
            for (let i = 0; i < 8; i++) {
                const sx2 = ((i * 5237) % 1000) / 1000 * W;
                const sy2 = y0 + 14 + ((i * 1933) % 7);
                ctx.fillStyle = 'rgba(100,80,60,0.6)';
                ctx.beginPath();
                ctx.ellipse(sx2, sy2, 3 + (i%3), 2, (i*0.5)%Math.PI, 0, Math.PI*2);
                ctx.fill();
            }

            // ── Tầng 3: Sâu (đá tối, 9px) ──
            const deepGrad = ctx.createLinearGradient(0, y0 + 23, 0, H);
            deepGrad.addColorStop(0, '#3a2810');
            deepGrad.addColorStop(1, '#1a1208');
            ctx.fillStyle = deepGrad;
            ctx.fillRect(0, y0 + 23, W, GH - 23);
            // Đốm khoáng sáng nhẹ
            for (let i = 0; i < 6; i++) {
                const mx = ((i * 6113) % 1000) / 1000 * W;
                const my = y0 + 25 + ((i * 2017) % 5);
                const glow = 0.3 + 0.2 * Math.sin(now * 0.001 + i * 2.1);
                ctx.fillStyle = `rgba(180,140,60,${glow})`;
                ctx.beginPath();
                ctx.arc(mx, my, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Đường nối 3 tầng (viền mờ)
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, y0 + 12); ctx.lineTo(W, y0 + 12); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, y0 + 23); ctx.lineTo(W, y0 + 23); ctx.stroke();

            // Ánh sáng bầu trời phủ lên mặt đất (gradient từ trên xuống)
            const ambGrad = ctx.createLinearGradient(0, y0, 0, H);
            ambGrad.addColorStop(0, `rgba(${skyC.r},${skyC.g},${skyC.b},${ambientAlpha})`);
            ambGrad.addColorStop(1, `rgba(${skyC.r},${skyC.g},${skyC.b},${ambientAlpha * 0.3})`);
            ctx.fillStyle = ambGrad;
            ctx.fillRect(0, y0, W, GH);

            ctx.restore();
        }

        function drawNightOverlay(ctx) {
            if (!isNight) return;
            const now = Date.now();
            const W = DISPLAY_WIDTH, H = DISPLAY_HEIGHT;
            ctx.save();
            ctx.setTransform(1,0,0,1,0,0);

            const nightP = getNightProgress(now); // 0→1 trong đêm

            // ── Trăng: 8 phase theo 8 đêm ──
            const totalElapsed = now - timers.startTime;
            const nightIndex = Math.floor(totalElapsed / DAY_NIGHT_CYCLE);
            const moonPhaseIdx = nightIndex % 8; // 0–7
            const moonX = W * 0.05 + nightP * W * 0.9;
            const moonY = 72;
            const moonR = 14;

            // Vầng sáng trăng — fullmoon rõ hơn
            const isFullMoon = moonPhaseIdx === 4;
            const isEclipse  = moonPhaseIdx === 0;
            const glowR = isFullMoon ? moonR + 22 : moonR + 10;
            const glowA = isFullMoon ? 0.20 : (isEclipse ? 0.06 : 0.09);
            ctx.beginPath(); ctx.arc(moonX, moonY, glowR, 0, Math.PI * 2);
            ctx.fillStyle = isEclipse ? `rgba(180,60,20,${glowA})` : `rgba(255,252,210,${glowA})`;
            ctx.fill();
            if (isFullMoon) {
                ctx.beginPath(); ctx.arc(moonX, moonY, moonR + 10, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,250,200,0.10)'; ctx.fill();
            }

            ctx.save();
            ctx.translate(moonX, moonY);

            if (moonPhaseIdx === 0) {
                // Trăng mới: tối hoàn toàn, chỉ có quầng sáng mờ (đã vẽ bên trên)
                // Không vẽ thân — trăng ẩn trong bóng tối

            } else if (moonPhaseIdx === 1) {
                // Trăng non (trái): lưỡi liềm mỏng bên trái
                ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,248,200,0.88)'; ctx.fill();
                ctx.beginPath(); ctx.arc(moonR * 0.65, 0, moonR * 1.0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20,20,40,0.95)'; ctx.fill();

            } else if (moonPhaseIdx === 2) {
                // Bán nguyệt (trái sáng)
                ctx.beginPath(); ctx.arc(0, 0, moonR, -Math.PI/2, Math.PI/2);
                ctx.fillStyle = 'rgba(255,248,200,0.92)'; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, moonR, Math.PI/2, -Math.PI/2);
                ctx.fillStyle = 'rgba(20,20,40,0.90)'; ctx.fill();

            } else if (moonPhaseIdx === 3) {
                // Gần đầy (trái): hầu hết sáng, bóng nhỏ phải
                ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,250,205,0.94)'; ctx.fill();
                ctx.beginPath(); ctx.arc(-moonR * 0.55, 0, moonR * 0.75, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20,20,40,0.92)'; ctx.fill();

            } else if (moonPhaseIdx === 4) {
                // Trăng tròn: sáng rực
                ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,252,220,0.98)'; ctx.fill();
                ctx.beginPath(); ctx.arc(-3, -3, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200,190,150,0.22)'; ctx.fill();
                ctx.beginPath(); ctx.arc(4, 4, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200,190,150,0.18)'; ctx.fill();

            } else if (moonPhaseIdx === 5) {
                // Gần đầy (phải): bóng nhỏ trái
                ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,250,205,0.94)'; ctx.fill();
                ctx.beginPath(); ctx.arc(moonR * 0.55, 0, moonR * 0.75, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20,20,40,0.92)'; ctx.fill();

            } else if (moonPhaseIdx === 6) {
                // Bán nguyệt (phải sáng)
                ctx.beginPath(); ctx.arc(0, 0, moonR, Math.PI/2, -Math.PI/2);
                ctx.fillStyle = 'rgba(255,248,200,0.92)'; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, moonR, -Math.PI/2, Math.PI/2);
                ctx.fillStyle = 'rgba(20,20,40,0.90)'; ctx.fill();

            } else {
                // Trăng tàn (phải): lưỡi liềm mỏng phải
                ctx.beginPath(); ctx.arc(0, 0, moonR, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,248,200,0.80)'; ctx.fill();
                ctx.beginPath(); ctx.arc(-moonR * 0.65, 0, moonR * 1.0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(20,20,40,0.95)'; ctx.fill();
            }
            ctx.restore();

            // ── Sao: nằm trong dải bầu trời, nhấp nháy nhanh ──
            for (let i = 0; i < 55; i++) {
                const sx = ((i * 4517) % 1000) / 1000 * W;
                const sy = 8 + ((i * 3319) % 1000) / 1000 * (SKY_HEIGHT - 20);
                const pulse = 0.3 + 0.7 * Math.abs(Math.sin(now * 0.004 + i * 1.7)); // 4× nhanh hơn
                const sr = (i % 5 === 0 ? 3.8 : 2.2) * pulse;
                ctx.globalAlpha = (0.5 + 0.5 * pulse) * 0.9;
                ctx.fillStyle = i % 7 === 0 ? 'rgba(200,220,255,1)' : 'rgba(255,255,210,1)';
                ctx.beginPath();
                ctx.moveTo(sx,            sy - sr * 2.2);
                ctx.lineTo(sx + sr * 0.4, sy - sr * 0.4);
                ctx.lineTo(sx + sr * 2.2, sy);
                ctx.lineTo(sx + sr * 0.4, sy + sr * 0.4);
                ctx.lineTo(sx,            sy + sr * 2.2);
                ctx.lineTo(sx - sr * 0.4, sy + sr * 0.4);
                ctx.lineTo(sx - sr * 2.2, sy);
                ctx.lineTo(sx - sr * 0.4, sy - sr * 0.4);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function drawDayOverlay(ctx) {
            if (isNight) return;
            const now = Date.now();
            const W = DISPLAY_WIDTH, H = DISPLAY_HEIGHT;
            ctx.save();
            ctx.setTransform(1,0,0,1,0,0);

            const dayP = getDayProgress(now);
            const isSunny = currentWeather === 'sunny';

            // ── 5 phase mặt trời ──
            // dawn(0-0.1), morning(0.1-0.35), noon(0.35-0.65), afternoon(0.65-0.9), dusk(0.9-1)
            let sunPhase, sunColor, sunRimColor, sunCoreColor, sunR, glowMultiplier;
            if (dayP < 0.10) {
                sunPhase = 'dawn';
                const t = dayP / 0.10;
                sunColor    = `rgba(${220+35*t},${100+80*t},${40},0.95)`;
                sunRimColor = `rgba(255,160,60,0.6)`;
                sunCoreColor= `rgba(255,220,140,0.5)`;
                sunR        = 10 + t * 4;
                glowMultiplier = 0.5 + t * 0.5;
            } else if (dayP < 0.35) {
                sunPhase = 'morning';
                const t = (dayP - 0.10) / 0.25;
                sunColor    = `rgba(255,${200+30*t},${80+60*t},0.97)`;
                sunRimColor = `rgba(255,210,80,0.6)`;
                sunCoreColor= `rgba(255,245,180,0.55)`;
                sunR        = 14 + t * 3;
                glowMultiplier = 0.8 + t * 0.2;
            } else if (dayP < 0.65) {
                sunPhase = 'noon';
                sunColor    = 'rgba(255,230,50,0.98)';
                sunRimColor = `rgba(255,220,20,0.65)`;
                sunCoreColor= `rgba(255,252,200,0.65)`;
                sunR        = 17;
                glowMultiplier = 1.0;
            } else if (dayP < 0.90) {
                sunPhase = 'afternoon';
                const t = (dayP - 0.65) / 0.25;
                sunColor    = `rgba(255,${230-50*t},${50-10*t},0.97)`;
                sunRimColor = `rgba(255,190,60,0.6)`;
                sunCoreColor= `rgba(255,230,160,0.5)`;
                sunR        = 17 - t * 3;
                glowMultiplier = 1.0 - t * 0.3;
            } else {
                sunPhase = 'dusk';
                const t = (dayP - 0.90) / 0.10;
                sunColor    = `rgba(${220+10*t},${80-30*t},${20},0.95)`;
                sunRimColor = `rgba(220,80,30,0.55)`;
                sunCoreColor= `rgba(255,180,100,0.45)`;
                sunR        = 14 - t * 5;
                glowMultiplier = 0.5 - t * 0.4;
            }

            const sunX = W * 0.05 + dayP * W * 0.9;
            const sunY = 72;
            const rayRot = now * 0.0008;
            const glowPulse = 0.7 + 0.3 * Math.sin(now * 0.002);
            const glowMax = (isSunny ? 55 : 35) * glowMultiplier;

            // Quầng sáng + tia: chỉ vẽ khi không phải dawn/dusk (dawn/dusk tự vẽ riêng)
            if (sunPhase !== 'dawn' && sunPhase !== 'dusk') {
                ctx.beginPath(); ctx.arc(sunX, sunY, sunR + glowMax * glowPulse, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,200,80,${0.04 * glowPulse * glowMultiplier})`; ctx.fill();
                ctx.beginPath(); ctx.arc(sunX, sunY, sunR + glowMax*0.6*glowPulse, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,180,60,${0.07 * glowPulse * glowMultiplier})`; ctx.fill();
                ctx.beginPath(); ctx.arc(sunX, sunY, sunR + glowMax*0.3*glowPulse, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,160,40,${0.13 * glowPulse * glowMultiplier})`; ctx.fill();

                ctx.save();
                ctx.translate(sunX, sunY);
                ctx.rotate(rayRot);
                const rayCount = isSunny ? 16 : 12;
                for (let r = 0; r < rayCount; r++) {
                    const angle = (r / rayCount) * Math.PI * 2;
                    const pp = 0.5 + 0.5 * Math.sin(now * 0.003 + r * 0.9);
                    const isMain = r % (isSunny ? 2 : 3) === 0;
                    const inner = sunR + 2;
                    const outer = isMain
                        ? sunR + (isSunny ? 22 : 13) * glowMultiplier + pp * (isSunny ? 12 : 7)
                        : sunR + (isSunny ? 11 : 7)  * glowMultiplier + pp * (isSunny ? 6  : 3);
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle)*inner, Math.sin(angle)*inner);
                    ctx.lineTo(Math.cos(angle)*outer, Math.sin(angle)*outer);
                    ctx.strokeStyle = sunColor.replace('0.95','0.6').replace('0.97','0.6').replace('0.98','0.7');
                    ctx.lineWidth = isMain ? (isSunny ? 3 : 2) : (isSunny ? 1.8 : 1.2);
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                if (isSunny && glowMultiplier > 0.5) {
                    ctx.globalAlpha = 0.06 * glowMultiplier + 0.03 * Math.sin(now * 0.0015);
                    for (let r = 0; r < 4; r++) {
                        const a = rayRot*0.3 + (r/4)*Math.PI*2;
                        ctx.beginPath(); ctx.moveTo(0,0);
                        ctx.lineTo(Math.cos(a)*(sunR+45*glowMultiplier), Math.sin(a)*(sunR+45*glowMultiplier));
                        ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(255,230,100,1)'; ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }
                ctx.restore();
            }

            // Thân mặt trời — chỉ vẽ phần nổi trên mây (clip nửa dưới nếu dawn/dusk)
            if (sunPhase === 'dawn' || sunPhase === 'dusk') {
                const t = sunPhase === 'dawn'
                    ? dayP / 0.10           // 0→1: mọc dần lên
                    : (dayP - 0.90) / 0.10; // 0→1: chìm dần xuống

                // Đường mây: bình minh mặt trời ở dưới mây ban đầu → nổi lên
                // t=0 dawn: sunY_effective = sunY + sunR*2 (còn ẩn dưới mây)
                // t=1 dawn: sunY_effective = sunY (đã lên hẳn)
                // t=0 dusk: sunY_effective = sunY (còn trên mây)
                // t=1 dusk: sunY_effective = sunY + sunR*2 (đã chìm)
                const riseOffset = sunPhase === 'dawn'
                    ? (1 - t) * sunR * 2.2
                    : t * sunR * 2.2;
                const drawSunY = sunY + riseOffset;

                // Đường chân trời mây — cố định tại sunY + một chút
                const horizonY = sunY + sunR * 0.4;

                // Vẽ glow + tia từ vị trí mặt trời thực (trước khi clip)
                const glowPulse2 = 0.7 + 0.3 * Math.sin(now * 0.002);
                const glowMax2 = 30 * glowMultiplier;
                ctx.beginPath(); ctx.arc(sunX, drawSunY, sunR + glowMax2 * glowPulse2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,160,60,${0.06 * glowPulse2 * glowMultiplier})`; ctx.fill();
                ctx.beginPath(); ctx.arc(sunX, drawSunY, sunR + glowMax2*0.4*glowPulse2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,130,40,${0.10 * glowPulse2 * glowMultiplier})`; ctx.fill();

                // Clip: chỉ vẽ phần nổi trên đường mây
                ctx.save();
                ctx.beginPath();
                ctx.rect(sunX - sunR * 3, 0, sunR * 6, horizonY);
                ctx.clip();

                // Thân mặt trời
                ctx.beginPath(); ctx.arc(sunX, drawSunY, sunR, 0, Math.PI * 2);
                ctx.fillStyle = sunColor; ctx.fill();
                ctx.beginPath(); ctx.arc(sunX, drawSunY, sunR * 0.55, 0, Math.PI * 2);
                ctx.fillStyle = sunCoreColor; ctx.fill();

                ctx.restore();

                // ── Dải mây chân trời nhiều lớp ──
                ctx.save();
                // Ánh sáng hắt từ mặt trời lên mây — gradient ngang
                const skyGlow = ctx.createLinearGradient(sunX - 120, 0, sunX + 120, 0);
                const glowCol = sunPhase === 'dawn' ? '255,160,80' : '220,100,40';
                skyGlow.addColorStop(0,   `rgba(${glowCol},0)`);
                skyGlow.addColorStop(0.5, `rgba(${glowCol},${0.18 * glowMultiplier})`);
                skyGlow.addColorStop(1,   `rgba(${glowCol},0)`);
                ctx.fillStyle = skyGlow;
                ctx.fillRect(sunX - 120, horizonY - 8, 240, 22);

                // Lớp mây 1 — dày, nền
                const c1Col = sunPhase === 'dawn' ? `rgba(255,190,110,0.72)` : `rgba(210,100,50,0.72)`;
                ctx.fillStyle = c1Col;
                ctx.beginPath();
                ctx.ellipse(sunX - 10, horizonY + 5, sunR * 2.8, sunR * 0.7, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(sunX + sunR * 1.6, horizonY + 8, sunR * 1.8, sunR * 0.55, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(sunX - sunR * 2.0, horizonY + 6, sunR * 2.0, sunR * 0.6, 0, 0, Math.PI*2); ctx.fill();

                // Lớp mây 2 — sáng hơn, phủ lên trên (viền trên mây)
                const c2Col = sunPhase === 'dawn' ? `rgba(255,220,160,0.55)` : `rgba(240,140,70,0.55)`;
                ctx.fillStyle = c2Col;
                ctx.beginPath();
                ctx.ellipse(sunX, horizonY + 2, sunR * 2.2, sunR * 0.45, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(sunX + sunR * 2.2, horizonY + 4, sunR * 1.5, sunR * 0.38, 0, 0, Math.PI*2); ctx.fill();

                // Lớp mây 3 — mỏng, viền sáng nhất (rim light từ mặt trời)
                const c3Col = sunPhase === 'dawn' ? `rgba(255,240,200,0.40)` : `rgba(255,180,100,0.35)`;
                ctx.fillStyle = c3Col;
                ctx.beginPath();
                ctx.ellipse(sunX + sunR * 0.3, horizonY, sunR * 1.6, sunR * 0.28, 0, 0, Math.PI*2); ctx.fill();

                ctx.restore();

            } else {
                // Buổi sáng / trưa / chiều: vẽ mặt trời bình thường
                ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
                ctx.fillStyle = sunColor; ctx.fill();
                ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 0.55, 0, Math.PI * 2);
                ctx.fillStyle = sunCoreColor; ctx.fill();
            }

            ctx.restore();
        }

        function drawWeatherOverlay(ctx) {
            // Chỉ vẽ những thứ thuộc world space (mưa rơi trên mặt đất, gió thổi)
            const now = Date.now();
            const W = DISPLAY_WIDTH, H = DISPLAY_HEIGHT;
            ctx.save();
            ctx.setTransform(1,0,0,1,0,0);
            switch(currentWeather) {
                case 'rain': {
                    // Hạt mưa (vẽ trên toàn màn hình, không cần clip)
                    ctx.strokeStyle = 'rgba(140,180,255,0.32)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 100; i++) {
                        const rx = (((i * 2311) % 1000) / 1000) * W;
                        const ry = (((i * 1733 + now * 0.08) % 1000) / 1000) * H;
                        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 2, ry + 12); ctx.stroke();
                    }
                    break;
                }
                case 'wind': {
                    ctx.strokeStyle = 'rgba(200,220,255,0.15)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 30; i++) {
                        const ry = (((i * 1777 + now * 0.12) % 1000) / 1000) * H;
                        const len = 40 + ((i * 37) % 80);
                        const rx = ((now * 0.15 * (0.7 + (i%3)*0.3) + i * 500) % (W + len)) - len;
                        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + len, ry); ctx.stroke();
                    }
                    break;
                }
                case 'sunny': {
                    const sg = ctx.createRadialGradient(W*0.5, H*0.08, 0, W*0.5, H*0.08, W*0.45);
                    sg.addColorStop(0, 'rgba(255,240,150,0.06)');
                    sg.addColorStop(1, 'rgba(255,240,150,0)');
                    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
                    break;
                }
            }
            ctx.restore();
        }

        // Mây vẽ trong sky space — sau drawSkyBackground, phủ lên nền trời
        function drawSkyWeather(ctx) {
            const now = Date.now();
            const W = DISPLAY_WIDTH;
            const SH = SKY_HEIGHT;
            ctx.save();
            ctx.setTransform(1,0,0,1,0,0);
            ctx.beginPath(); ctx.rect(0, 0, W, SH); ctx.clip();
            switch(currentWeather) {
                case 'rain': {
                    // Mưa: 12 đám mây phủ kín bầu trời, 3 tầng độ cao
                    for (let c = 0; c < 12; c++) {
                        const layer   = c % 3;
                        const speed   = 0.008 + layer * 0.005 + (c % 4) * 0.002;
                        const cx = ((now * speed + c * (W / 11)) % (W + 350)) - 175;
                        const cy = 14 + layer * 24;
                        const scale = 0.7 + layer * 0.18;
                        ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
                        ctx.fillStyle = `rgba(${55+layer*12},${65+layer*10},${90+layer*8},${0.72 - layer * 0.08})`;
                        [[0,0,46],[38,-13,34],[-35,-10,30],[70,3,27],[-62,7,25],[30,12,22],[-18,-17,20],[55,-9,18],[-10,5,16]].forEach(([dx,dy,r]) => {
                            ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI*2); ctx.fill();
                        });
                        ctx.restore();
                    }
                    break;
                }
                case 'wind': {
                    // Gió: 4 đám mây trắng bay nhanh
                    for (let i = 0; i < 4; i++) {
                        const cx = ((now * 0.06 * (0.8 + i * 0.2) + i * 600) % (W + 200)) - 100;
                        const cy = 28 + i * 14;
                        ctx.save(); ctx.translate(cx, cy);
                        ctx.fillStyle = `rgba(210,218,228,${0.55 + i * 0.05})`;
                        [[0,0,26],[22,-8,18],[-18,-5,16],[38,2,15],[-34,4,14]].forEach(([dx,dy,r]) => {
                            ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI*2); ctx.fill();
                        });
                        ctx.restore();
                    }
                    break;
                }
                case 'sunny': {
                    // Nắng: 2 đám mây trắng thưa
                    for (let i = 0; i < 2; i++) {
                        const cx = ((now * 0.008 * (1 + i * 0.5) + i * 900) % (W + 300)) - 150;
                        const cy = 30 + i * 20;
                        ctx.save(); ctx.translate(cx, cy);
                        ctx.fillStyle = `rgba(255,255,255,0.45)`;
                        [[0,0,22],[18,-6,16],[-16,-4,14],[32,2,13]].forEach(([dx,dy,r]) => {
                            ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI*2); ctx.fill();
                        });
                        ctx.restore();
                    }
                    break;
                }
            }
            ctx.restore();
        }

        function draw() {
            // FPS counter
            frameCount++;
            const nowPerf = performance.now();
            if (nowPerf - lastFpsTime >= 1000) {
                fps = Math.round(frameCount * 1000 / (nowPerf - lastFpsTime));
                frameCount = 0;
                lastFpsTime = nowPerf;
                const fc = document.getElementById('fpsCounter'); if (fc) fc.textContent = `FPS: ${fps}`;
            }

            ctx.clearRect(0, 0, DISPLAY_WIDTH, DISPLAY_HEIGHT);

            // ── Clip world vào vùng giữa: dưới sky, trên ground ──
            const _worldTop    = SKY_HEIGHT;
            const _worldBottom = DISPLAY_HEIGHT - GROUND_HEIGHT;
            const _worldH      = _worldBottom - _worldTop;
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, _worldTop, DISPLAY_WIDTH, _worldH);
            ctx.clip();

            ctx.save();
            ctx.translate(offsetX, offsetY + _worldTop); // shift xuống để vào đúng vùng
            ctx.scale(zoom, zoom);

            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            pheromones.forEach(p => {
                if (!isInView(p.x, p.y)) return;
                const timeFade = p.strength / (p.maxStrength || 400);
                const hue = (p.color.match(/\d+/) || ['120'])[0];

                if (p.type === 'nest') {
                    // Pheromone nest: chấm vuông nhỏ đỏ nhạt — cảnh báo lãnh thổ
                    const alpha = Math.min(0.12, 0.04 + timeFade * 0.08);
                    ctx.fillStyle = `hsla(0, 80%, 60%, ${alpha})`;
                    const size = 1.2 + timeFade * 0.8;
                    ctx.fillRect(p.x - size/2, p.y - size/2, size, size);
                } else {
                    // Pheromone food: chấm tròn màu tổ — dẫn đường
                    const target = p.food || p.water;
                    let proximityFade = 0.3;
                    if (target) {
                        const distToTarget = Math.hypot(p.x - target.x, p.y - target.y);
                        proximityFade = Math.max(0.15, Math.min(1.0, 1 - distToTarget / 400));
                    }
                    const fade = timeFade * proximityFade;
                    const alpha = Math.min(0.08, 0.015 + fade * 0.065);
                    ctx.fillStyle = `hsla(${hue}, 100%, 65%, ${alpha})`;
                    const size = 0.7 + fade * 0.8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Highlight selected nest on map
            if (selectedNest && !selectedNest.toRemove) {
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.arc(selectedNest.x, selectedNest.y, 30, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Vẽ warps
            const warpNow = Date.now();
            warps.forEach(w => {
                if (!isInView(w.x, w.y)) return;
                const age = warpNow - w.creationTime;
                const lifeRatio = 1 - age / WARP_LIFETIME;
                const pulse = 0.7 + 0.3 * Math.sin(warpNow / 300);
                const hue = (w.homeNest.color.match(/\d+/) || ['200'])[0];
                // Vòng ngoài
                ctx.beginPath();
                ctx.arc(w.x, w.y, WARP_RADIUS * pulse, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${0.6 * lifeRatio})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                // Lõi xoáy
                ctx.beginPath();
                ctx.arc(w.x, w.y, WARP_RADIUS * 0.5 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 100%, 85%, ${0.4 * lifeRatio})`;
                ctx.fill();
                // Thời gian còn lại
                const secLeft = Math.ceil((WARP_LIFETIME - age) / 1000);
                ctx.fillStyle = `rgba(255,255,255,${0.7 * lifeRatio})`;
                ctx.font = '9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`⬡ ${secLeft}s`, w.x, w.y + WARP_RADIUS + 10);
                ctx.textAlign = 'left';
            });

            nests.forEach(nest => {
                if (!isInView(nest.x, nest.y)) return;
                const foodScale = 1 + Math.min(nest.food || 0, 500) / 100;
                const totalNestAnts = nest.larvae + totalNurse(nest) + nest.scoutIn + nest.warIn;
                const antScale = 1 + Math.min(totalNestAnts, 300) / 30;
                drawNestStatusCircle(nest);
                drawNurseHomeParade(nest);

                const gradient = ctx.createRadialGradient(nest.x, nest.y, 2, nest.x, nest.y, Math.max(2, 10 * foodScale));
                gradient.addColorStop(0, nest.color);
                gradient.addColorStop(1, `hsla(${nest.color.match(/\d+/)[0]}, 100%, 50%, 0.3)`);
                ctx.strokeStyle = "lime";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(nest.x, nest.y - (6 * antScale));
                ctx.lineTo(nest.x - (5 * antScale), nest.y + (3 * antScale));
                ctx.lineTo(nest.x + (5 * antScale), nest.y + (3 * antScale));
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();
                // Vẽ tên tổ nhỏ dưới icon
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.font = 'bold 11px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(nest.name, nest.x, nest.y + 14);

                if (nest.isAttacking) {
                    ctx.fillStyle = "red";
                    ctx.font = "20px Arial";
                    ctx.fillText("⚔️", nest.x, nest.y - 30);
                }
                if (nest.isDefending) {
                    ctx.fillStyle = "blue";
                    ctx.font = "20px Arial";
                    ctx.fillText("🛡️", nest.x, nest.y - 30);
                }
                if (nest.isStarving) {
                    ctx.fillStyle = "yellow";
                    ctx.font = "20px Arial";
                    ctx.fillText("⚠️", nest.x, nest.y - 30);
                }
                if (nest.isFlooding) {
                    ctx.font = "14px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText("🌊", nest.x + 14, nest.y - 30);
                }
                if (nest.isDeleting) {
                    ctx.fillStyle = "purple";
                    ctx.font = "20px Arial";
                    ctx.fillText("💀", nest.x, nest.y - 30);
                }
            });

            const seasonProps = getSeasonProperties(currentSeason);
            // ── Vẽ chướng ngại vật (tất cả type stone, hình dáng khác nhau) ──
            obstacles.forEach(obs => {
                if (!isInView(obs.x, obs.y)) return;
                const dmgRatio = (obs.maxHp && obs.hp != null) ? Math.max(0, 1 - obs.hp / obs.maxHp) : 0;
                ctx.save();
                ctx.translate(obs.x, obs.y);
                ctx.rotate(obs.angle || 0);

                // Màu nền tối dần theo damage
                const baseL = Math.floor(50 - dmgRatio * 20);
                ctx.fillStyle   = obs.color   || `hsl(0,0%,${baseL}%)`;
                ctx.strokeStyle = obs.borderColor || '#999';
                ctx.lineWidth   = 1.5;

                if (obs.shape === 'rect') {
                    ctx.fillRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h);
                    ctx.strokeRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h);
                } else if (obs.shape === 'ellipse') {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, obs.rx, obs.ry, 0, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                } else if (obs.shape === 'polygon' && obs.points) {
                    ctx.restore(); ctx.save();
                    ctx.translate(0, 0);
                    ctx.fillStyle   = obs.color   || '#666';
                    ctx.strokeStyle = obs.borderColor || '#999';
                    ctx.lineWidth   = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(obs.points[0].x, obs.points[0].y);
                    for (let i = 1; i < obs.points.length; i++) ctx.lineTo(obs.points[i].x, obs.points[i].y);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();
                }

                // ── Vẽ vết nứt (cracks) theo damage ──
                if (obs.cracks && dmgRatio > 0) {
                    const maxCracks  = obs.cracks.length;
                    // Số vết nứt hiện ra tỉ lệ với damage (ít nhất 1 khi bắt đầu bị đánh)
                    const showCount  = Math.max(1, Math.ceil(dmgRatio * maxCracks));
                    // Độ đậm + độ dày tăng theo damage
                    const alpha      = 0.35 + dmgRatio * 0.55;
                    const lineW      = 0.8 + dmgRatio * 1.8;

                    ctx.save();
                    // Với polygon cần translate về tâm vì đã restore trước
                    if (obs.shape === 'polygon') ctx.translate(obs.x, obs.y);
                    ctx.strokeStyle = `rgba(20,10,5,${alpha})`;
                    ctx.lineWidth   = lineW;
                    ctx.lineCap     = 'round';

                    for (let i = 0; i < showCount; i++) {
                        const c  = obs.cracks[i];
                        const x0 = c.ox;
                        const y0 = c.oy;
                        const x1 = x0 + Math.cos(c.angle) * c.len;
                        const y1 = y0 + Math.sin(c.angle) * c.len;
                        ctx.beginPath();
                        ctx.moveTo(x0, y0);
                        ctx.lineTo(x1, y1);
                        ctx.stroke();
                        // Nhánh phụ
                        c.branches.forEach(b => {
                            ctx.beginPath();
                            ctx.moveTo(x0 + Math.cos(c.angle) * c.len * 0.5,
                                       y0 + Math.sin(c.angle) * c.len * 0.5);
                            ctx.lineTo(x0 + Math.cos(c.angle) * c.len * 0.5 + Math.cos(b.angle) * b.len,
                                       y0 + Math.sin(c.angle) * c.len * 0.5 + Math.sin(b.angle) * b.len);
                            ctx.stroke();
                        });
                    }
                    ctx.restore();
                }

                ctx.restore();
            });

            foods.forEach(food => {
                if (!isInView(food.x, food.y)) return;
                ctx.fillStyle = seasonProps.color;
                const radius = (8 + (food.amount / 6000) * 16) * seasonProps.sizeMultiplier;
                ctx.beginPath();
                ctx.arc(food.x, food.y, radius, 0, Math.PI * 2);
                ctx.fill();
            });

            waters.forEach(w => {
                if (w.amount <= 30 || !isInView(w.x, w.y)) return;
                const fillAlpha = 0.35 + (w.amount / 20000) * 0.45;
                const strokeAlpha = 0.5 + (w.amount / 20000) * 0.3;
                ctx.save();
                ctx.translate(w.x, w.y);
                ctx.rotate(w.shapeAngle);
                ctx.fillStyle = w.isPuddle ? `rgba(160, 80, 240, ${fillAlpha})` : `rgba(80, 160, 240, ${fillAlpha})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, w.radiusX, w.radiusY, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = w.isPuddle ? `rgba(120, 40, 220, ${strokeAlpha})` : `rgba(40, 120, 220, ${strokeAlpha})`;
                ctx.lineWidth = 2 + (w.amount / 10000);
                ctx.stroke();
                ctx.restore();
            });
            explosions.forEach(e => {
                const elapsed = Date.now() - e.creationTime;
                if (elapsed >= 1200 || !isInView(e.x, e.y)) return;
                const r = e.radius || 40;
                const progress = elapsed / 1200;
                const alpha = 1 - progress;
                const flashAlpha = Math.max(0, 1 - elapsed / 300);
                if (flashAlpha > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, r * (1 + progress * 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.strokeStyle = `rgba(255, 80, 0, ${alpha * 0.9})`;
                ctx.lineWidth = 6 + (1 - progress) * 10;
                ctx.beginPath();
                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = `rgba(100, 180, 255, ${alpha * 0.35})`;
                ctx.beginPath();
                ctx.arc(e.x, e.y, r + progress * 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(e.x, e.y, r + progress * 15, 0, Math.PI * 2);
                ctx.stroke();
            });

            // ── Vẽ đám bụi giao tranh ──
            dusts.forEach(d => {
                if (!isInView(d.x, d.y)) return;
                const age = warpNow - d.creationTime;
                const lifeRatio = 1 - age / 2000;
                if (lifeRatio <= 0) return;
                const r = 6 + (1 - lifeRatio) * 12; // x2: 6→18px
                ctx.globalAlpha = lifeRatio * 0.45;
                ctx.fillStyle = '#c8b89a';
                ctx.beginPath();
                ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ants.forEach(ant => {
                if (!isInView(ant.x, ant.y)) return;
                if (ant.type === "WarAnt" || ant.type === "BomAnt") {
                    let dx = 1, dy = 0, angle = 0;
                    if (ant.targetAnt && !ant.targetAnt.toRemove) {
                        dx = ant.targetAnt.x - ant.x;
                        dy = ant.targetAnt.y - ant.y;
                    } else if (ant.targetNest) {
                        dx = ant.targetNest.x - ant.x;
                        dy = ant.targetNest.y - ant.y;
                    } else if (ant.homeNest) {
                        dx = ant.homeNest.x - ant.x;
                        dy = ant.homeNest.y - ant.y;
                    }
                    angle = Math.atan2(dy, dx);
                    const sizeMultiplier = 1.3;
                    const minHP = 2, maxHP = 50;
                    const minSize = 3, maxSize = 6;
                    const hpRatio = Math.max(0, Math.min(1, (ant.hp - minHP) / (maxHP - minHP)));
                    const dynamicSize = minSize + (maxSize - minSize) * hpRatio;
                    const arrowSize = dynamicSize * sizeMultiplier;
                    const triangleSize = dynamicSize * sizeMultiplier;
                    const hasHighlight = ant.hp >= 20;
                    ctx.save();
                    ctx.translate(ant.x, ant.y);
                    ctx.rotate(angle);
                    ctx.fillStyle = ant.color;
                    if (ant.homeNest?.isAttacking) {
                        ctx.beginPath();
                        ctx.moveTo(arrowSize, 0);
                        ctx.lineTo(-arrowSize, arrowSize / 2);
                        ctx.lineTo(-arrowSize / 2, 0);
                        ctx.lineTo(-arrowSize, -arrowSize / 2);
                        ctx.closePath();
                        ctx.fill();
                        if (hasHighlight) { ctx.strokeStyle = "white"; ctx.lineWidth = 0.5; ctx.stroke(); }
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(triangleSize, 0);
                        ctx.lineTo(-triangleSize, triangleSize / 2);
                        ctx.lineTo(-triangleSize, -triangleSize / 2);
                        ctx.closePath();
                        ctx.fill();
                        if (hasHighlight) { ctx.strokeStyle = "white"; ctx.lineWidth = 0.5; ctx.stroke(); }
                    }
                    if (ant.carrying > 0 || ant.carryingMilk > 0) {
                        ctx.fillStyle = "orange";
                        ctx.beginPath();
                        ctx.arc(-arrowSize, 0, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (ant.isBomAnt) {
                        ctx.fillStyle = ant.homeNest.isAttacking ? "red" : "blue";
                        ctx.beginPath();
                        ctx.arc(-arrowSize - 8, 0, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = "white";
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = ant.homeNest.isAttacking ? "red" : "blue";
                        ctx.beginPath();
                        ctx.arc(-arrowSize - 8, 0, 7, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    // ── BomAnt đang arm: vòng đỏ nhấp nháy đếm ngược ──
                    if (ant.isBomAnt && ant.explosionTime !== null) {
                        const countdown = 1 - Math.min((warpNow - ant.explosionTime) / 500, 1);
                        const pulse = 0.5 + 0.5 * Math.sin(warpNow / 80);
                        ctx.save();
                        ctx.globalAlpha = 0.7 * pulse;
                        ctx.strokeStyle = 'red';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(ant.x, ant.y, arrowSize + 4 + countdown * 6, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                    }
                    ctx.restore();
                }
                else if (ant.type === "scout" || ant.type === "ScoutWar") {
                    ctx.fillStyle = ant.type === "ScoutWar" ? "red" : (ant.homeNest?.color || "#888");
                    if (ant.carrying > 0 || ant.carryingWood > 0) {
                        // Kích thước theo lượng mang: min 4px, max 10px (tại 400 units)
                        const load = ant.carrying || ant.carryingWood || 0;
                        const s = Math.min(20, 8 + load / 30);
                        ctx.fillStyle = "orange";
                        ctx.fillRect(ant.x - s / 2, ant.y - s / 2, s, s);
                    }
                    else if (ant.carryingWater > 0) {
                        // Kích thước giọt nước theo lượng mang: scale 1.0→2.2
                        const load = ant.carryingWater || 0;
                        const scale = Math.min(2.2, 1.0 + load / 200);
                        ctx.fillStyle = "rgba(100, 180, 255, 0.92)";
                        ctx.beginPath();
                        ctx.moveTo(ant.x + 3 * scale, ant.y + 1 * scale);
                        ctx.lineTo(ant.x - 1 * scale, ant.y + 6 * scale);
                        ctx.quadraticCurveTo(ant.x, ant.y + 9 * scale, ant.x + 4 * scale, ant.y + 6 * scale);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = "rgba(60, 120, 220, 0.85)";
                        ctx.lineWidth = 1.4;
                        ctx.stroke();
                    }
                    else {
                        ctx.beginPath();
                        ctx.arc(ant.x, ant.y, 2, 0, Math.PI * 2);
                        ctx.fillStyle = ant.homeNest?.color || "#888";
                        ctx.fill();
                    }
                }
                else if (ant.type === "QueenAnt") {
                    ctx.fillStyle = ant.homeNest?.color || "#888";
                    const triangleSize = 10;
                    ctx.beginPath();
                    ctx.moveTo(ant.x, ant.y - triangleSize);
                    ctx.lineTo(ant.x - triangleSize / 2, ant.y + triangleSize / 2);
                    ctx.lineTo(ant.x + triangleSize / 2, ant.y + triangleSize / 2);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Vẽ xác kiến (corpse)
            corpses.forEach(c => {
                if (!isInView(c.x, c.y)) return;
                const alpha = 0.7 * (1 - c.decay);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.arc(c.x, c.y, 2.5 * (1 - c.decay * 0.5), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Vẽ hiệu ứng thời tiết overlay
            drawWeatherOverlay(ctx); // weather trong world (mưa rơi trên mặt đất)

            ctx.restore(); // ── kết thúc world transform ──
            ctx.restore(); // ── kết thúc clip vùng giữa ──

            // ── Screen space: sky → ground → clouds (thứ tự: nền trước, mây sau cùng) ──
            drawSkyBackground(ctx);
            drawNightOverlay(ctx);
            drawDayOverlay(ctx);
            drawGroundLayers(ctx);
            drawSkyWeather(ctx);    // mây vẽ sau cùng, phủ lên sky

            // Update nestList sidebar (every ~30 frames)
            updateNestListPanel();
            if (selectedNest && !selectedNest.toRemove) updateNestInfoPanel();
            updateWeather(Date.now());
            updateDayNight(Date.now());
            for (let s = 0; s < gameSpeed; s++) updateAnts();
            updateTopRightInfo();
            requestAnimationFrame(draw);
        }

        // ────────────────────────────────────────────────

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            // Tính tọa độ screen → world đúng cho mọi mức zoom
            mouseScreenX = e.clientX - rect.left;
            mouseScreenY = e.clientY - rect.top;
            mouseX = (mouseScreenX - offsetX) / zoom;
            mouseY = (mouseScreenY - offsetY) / zoom;
        });

        // Click trên canvas: chọn tổ gần nhất nếu click trong bán kính 40px world
        let _clickStartX = 0, _clickStartY = 0;
        canvas.addEventListener('click', (e) => {
            // Bỏ qua nếu người dùng đang kéo (drag > 5px)
            if (Math.hypot(e.clientX - _clickStartX, e.clientY - _clickStartY) > 5) return;
            const rect = canvas.getBoundingClientRect();
            const wx = (e.clientX - rect.left - offsetX) / zoom;
            const wy = (e.clientY - rect.top - SKY_HEIGHT - offsetY) / zoom;
            let closest = null, minDist = Infinity;
            nests.forEach(nest => {
                if (nest.toRemove) return;
                const d = Math.hypot(wx - nest.x, wy - nest.y);
                if (d < minDist) { minDist = d; closest = nest; }
            });
            if (closest && minDist < 60) {
                selectedNest = (selectedNest === closest) ? null : closest;
                updateNestInfoPanel();
            } else {
                selectedNest = null;
                updateNestInfoPanel();
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const mx = mouseScreenX;
            const my = mouseScreenY;
            const worldXBefore = (mx - offsetX) / zoom;
            const worldYBefore = (my - SKY_HEIGHT - offsetY) / zoom;
            const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            zoom = Math.max(zoomMin, Math.min(zoomMax, zoom * zoomFactor));
            offsetX = mx - worldXBefore * zoom;
            offsetY = my - worldYBefore * zoom;
            offsetX = Math.max(DISPLAY_WIDTH - WORLD_WIDTH * zoom, Math.min(0, offsetX));
            const _wzH = DISPLAY_HEIGHT - SKY_HEIGHT - GROUND_HEIGHT; offsetY = Math.max(_wzH - WORLD_HEIGHT * zoom, Math.min(0, offsetY));
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                _clickStartX = e.clientX;
                _clickStartY = e.clientY;
                dragStartX = e.clientX - offsetX;
                dragStartY = e.clientY - offsetY;
                canvas.style.cursor = 'grabbing';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
                offsetX = Math.max(DISPLAY_WIDTH - WORLD_WIDTH * zoom, Math.min(0, offsetX));
                const _wzH = DISPLAY_HEIGHT - SKY_HEIGHT - GROUND_HEIGHT; offsetY = Math.max(_wzH - WORLD_HEIGHT * zoom, Math.min(0, offsetY));
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isDragging = false;
                canvas.style.cursor = 'default';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });

        document.getElementById('resetView').addEventListener('click', () => {
            const scaleX = 1400 / WORLD_WIDTH;
            const scaleY = 680 / WORLD_HEIGHT;
            zoom = Math.min(scaleX, scaleY);
            resizeCanvas();
        });

        // Khởi tạo
        currentSeason = getCurrentSeason();
        spawnFoods();
        spawnInitialWaters();
        rebuildWaterGrid();
        spawnObstacles();
        rebuildObstacleGrid();

        for (let i = 0; i < 3; i++) {
            const x = randInt(200, WORLD_WIDTH - 200);
            const y = randInt(200, WORLD_HEIGHT - 200);
            const nest = createNewNest(x, y);
            nests.push(nest);
            initializeNestAnts(nest);
        }
        // Không còn setTimeout gameLoop riêng biệt nữa
        requestAnimationFrame(draw);

        // ══ Touch support (mobile) ══
        let _touch1 = null, _touch2 = null, _pinchDist0 = 0, _zoom0 = 1;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                _touch1 = e.touches[0];
                _touch2 = null;
                isDragging = true;
                _clickStartX = e.touches[0].clientX;
                _clickStartY = e.touches[0].clientY;
                dragStartX = e.touches[0].clientX - offsetX;
                dragStartY = e.touches[0].clientY - offsetY;
            } else if (e.touches.length === 2) {
                _touch1 = e.touches[0];
                _touch2 = e.touches[1];
                isDragging = false;
                _pinchDist0 = Math.hypot(_touch2.clientX - _touch1.clientX, _touch2.clientY - _touch1.clientY);
                _zoom0 = zoom;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const t = e.touches[0];
                mouseScreenX = t.clientX;
                mouseScreenY = t.clientY;
                mouseX = (mouseScreenX - offsetX) / zoom;
                mouseY = (mouseScreenY - offsetY) / zoom;
                offsetX = t.clientX - dragStartX;
                offsetY = t.clientY - dragStartY;
                offsetX = Math.max(DISPLAY_WIDTH - WORLD_WIDTH * zoom, Math.min(0, offsetX));
                const _wzH = DISPLAY_HEIGHT - SKY_HEIGHT - GROUND_HEIGHT; offsetY = Math.max(_wzH - WORLD_HEIGHT * zoom, Math.min(0, offsetY));
            } else if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                const midX = (t1.clientX + t2.clientX) / 2;
                const midY = (t1.clientY + t2.clientY) / 2;
                const worldXBefore = (midX - offsetX) / zoom;
                const worldYBefore = (midY - SKY_HEIGHT - offsetY) / zoom;
                zoom = Math.max(zoomMin, Math.min(zoomMax, _zoom0 * dist / _pinchDist0));
                offsetX = midX - worldXBefore * zoom;
                offsetY = midY - worldYBefore * zoom;
                offsetX = Math.max(DISPLAY_WIDTH - WORLD_WIDTH * zoom, Math.min(0, offsetX));
                const _wzH = DISPLAY_HEIGHT - SKY_HEIGHT - GROUND_HEIGHT; offsetY = Math.max(_wzH - WORLD_HEIGHT * zoom, Math.min(0, offsetY));
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (e.touches.length === 0) {
                // Tap để chọn tổ
                if (Math.hypot(e.changedTouches[0].clientX - _clickStartX, e.changedTouches[0].clientY - _clickStartY) < 10) {
                    const rect = canvas.getBoundingClientRect();
                    const wx = (e.changedTouches[0].clientX - rect.left - offsetX) / zoom;
                    const wy = (e.changedTouches[0].clientY - rect.top - offsetY) / zoom;
                    let closest = null, minDist = Infinity;
                    nests.forEach(nest => {
                        if (nest.toRemove) return;
                        const d = Math.hypot(wx - nest.x, wy - nest.y);
                        if (d < minDist) { minDist = d; closest = nest; }
                    });
                    if (closest && minDist < 80) {
                        selectedNest = (selectedNest === closest) ? null : closest;
                        updateNestInfoPanel();
                    } else {
                        selectedNest = null;
                        updateNestInfoPanel();
                    }
                }
                isDragging = false;
                _touch1 = null; _touch2 = null;
            }
        }, { passive: false });
    </script>
</body>
